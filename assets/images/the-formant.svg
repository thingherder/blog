<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="A schematic of the source-filter theory of the voice. On the left, a dense comb of thin evenly spaced vertical lines rises from a baseline — the raw pitched buzz of the vocal folds, the source, full of harmonics of equal loudness. A faint curved outline of a vocal tract, a throat bending into a mouth, arcs across the middle of the scene. Over the comb lies a smooth glowing envelope curve with three humps — the resonance of the tract, the filter — and where each hump peaks, the harmonic lines beneath it are drawn tall and bright while the harmonics between the humps are dimmed and short, showing which frequencies the cavity amplifies. The three bright peaks are labelled F1, F2, F3, the formants. On the right, three horizontal glowing bands stack up like a spectrogram, the same three formants seen as steady stripes. Small italic labels read source, filter, and formants.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15181f"/>
      <stop offset="1" stop-color="#0b0d11"/>
    </linearGradient>
    <linearGradient id="env" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4d58a"/>
      <stop offset="0.5" stop-color="#ef9f52"/>
      <stop offset="1" stop-color="#e07a4b"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd98e" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#ffcf7d" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#e07a4b" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="peakglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffdf9e" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffdf9e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- faint vocal tract: a bent cavity, throat rising into mouth -->
  <path d="M 150 560 C 150 430, 210 380, 300 372 C 470 358, 560 300, 600 210 C 632 138, 720 120, 800 150"
        fill="none" stroke="#3a424e" stroke-width="46" stroke-linecap="round" opacity="0.32"/>
  <path d="M 150 560 C 150 430, 210 380, 300 372 C 470 358, 560 300, 600 210 C 632 138, 720 120, 800 150"
        fill="none" stroke="#525d6b" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- baseline of the spectrum -->
  <line x1="150" y1="470" x2="760" y2="470" stroke="#4a5461" stroke-width="1.5" opacity="0.55"/>

  <!-- the resonance envelope (the filter): three humps = three formants -->
  <!-- peaks centered near x=250 (F1), x=430 (F2), x=630 (F3) -->
  <path d="M 150 458
           C 200 458, 220 250, 250 250
           C 285 250, 300 400, 340 400
           C 380 400, 400 210, 430 210
           C 470 210, 490 388, 540 392
           C 585 396, 605 300, 630 300
           C 665 300, 700 430, 760 448"
        fill="none" stroke="url(#env)" stroke-width="4.5" stroke-linecap="round"/>
  <ellipse cx="250" cy="255" rx="70" ry="70" fill="url(#peakglow)"/>
  <ellipse cx="430" cy="215" rx="78" ry="78" fill="url(#peakglow)"/>
  <ellipse cx="630" cy="305" rx="62" ry="62" fill="url(#peakglow)"/>

  <!-- the source: a comb of harmonics; tall+bright under peaks, dim between -->
  <g stroke-linecap="round">
    <!-- rendered as evenly spaced lines from baseline (y=470) up to the envelope -->
    <line x1="165" y1="470" x2="165" y2="452" stroke="#5c6672" stroke-width="3"/>
    <line x1="185" y1="470" x2="185" y2="440" stroke="#6b7684" stroke-width="3"/>
    <line x1="205" y1="470" x2="205" y2="392" stroke="#c9973f" stroke-width="3"/>
    <line x1="225" y1="470" x2="225" y2="300" stroke="#f2c368" stroke-width="3.4"/>
    <line x1="245" y1="470" x2="245" y2="256" stroke="#ffdf9e" stroke-width="3.6"/>
    <line x1="265" y1="470" x2="265" y2="300" stroke="#f2c368" stroke-width="3.4"/>
    <line x1="285" y1="470" x2="285" y2="392" stroke="#c9973f" stroke-width="3"/>
    <line x1="305" y1="470" x2="305" y2="418" stroke="#6b7684" stroke-width="3"/>
    <line x1="325" y1="470" x2="325" y2="404" stroke="#5c6672" stroke-width="3"/>
    <line x1="345" y1="470" x2="345" y2="398" stroke="#6b7684" stroke-width="3"/>
    <line x1="365" y1="470" x2="365" y2="356" stroke="#c9973f" stroke-width="3"/>
    <line x1="385" y1="470" x2="385" y2="280" stroke="#f2c368" stroke-width="3.4"/>
    <line x1="405" y1="470" x2="405" y2="228" stroke="#ffdf9e" stroke-width="3.6"/>
    <line x1="425" y1="470" x2="425" y2="214" stroke="#ffe7b0" stroke-width="3.8"/>
    <line x1="445" y1="470" x2="445" y2="232" stroke="#ffdf9e" stroke-width="3.6"/>
    <line x1="465" y1="470" x2="465" y2="292" stroke="#f2c368" stroke-width="3.4"/>
    <line x1="485" y1="470" x2="485" y2="372" stroke="#c9973f" stroke-width="3"/>
    <line x1="505" y1="470" x2="505" y2="408" stroke="#6b7684" stroke-width="3"/>
    <line x1="525" y1="470" x2="525" y2="404" stroke="#5c6672" stroke-width="3"/>
    <line x1="545" y1="470" x2="545" y2="398" stroke="#6b7684" stroke-width="3"/>
    <line x1="565" y1="470" x2="565" y2="360" stroke="#b98a3c" stroke-width="3"/>
    <line x1="585" y1="470" x2="585" y2="330" stroke="#d9a94f" stroke-width="3.2"/>
    <line x1="605" y1="470" x2="605" y2="312" stroke="#f2c368" stroke-width="3.4"/>
    <line x1="625" y1="470" x2="625" y2="306" stroke="#ffd98e" stroke-width="3.4"/>
    <line x1="645" y1="470" x2="645" y2="316" stroke="#f2c368" stroke-width="3.4"/>
    <line x1="665" y1="470" x2="665" y2="352" stroke="#d9a94f" stroke-width="3.2"/>
    <line x1="685" y1="470" x2="685" y2="404" stroke="#6b7684" stroke-width="3"/>
    <line x1="705" y1="470" x2="705" y2="428" stroke="#5c6672" stroke-width="3"/>
    <line x1="725" y1="470" x2="725" y2="446" stroke="#4f5966" stroke-width="3"/>
  </g>

  <!-- peak labels: the formants -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#f4d58a">
    <text x="250" y="238" font-size="22" text-anchor="middle">F1</text>
    <text x="430" y="196" font-size="22" text-anchor="middle">F2</text>
    <text x="630" y="288" font-size="22" text-anchor="middle">F3</text>
  </g>

  <!-- right: the same formants as horizontal spectrogram bands -->
  <g>
    <rect x="850" y="196" width="300" height="20" rx="10" fill="url(#band)"/>
    <rect x="850" y="286" width="300" height="26" rx="13" fill="url(#band)"/>
    <rect x="850" y="392" width="300" height="16" rx="8" fill="url(#band)"/>
    <g font-family="Georgia, 'Times New Roman', serif" fill="#c9b896" font-size="18" text-anchor="start">
      <text x="1120" y="182" text-anchor="end" font-style="italic" fill="#7c8794">the same voice,</text>
      <text x="1120" y="440" text-anchor="end" font-style="italic" fill="#7c8794">seen as steady stripes</text>
    </g>
  </g>

  <!-- section labels -->
  <g font-family="Georgia, 'Times New Roman', serif" font-style="italic">
    <text x="160" y="520" font-size="24" fill="#8892a0">source — the raw pitched buzz</text>
    <text x="160" y="150" font-size="24" fill="#e6a84b">filter — the shape of the cavity</text>
    <text x="850" y="540" font-size="24" fill="#e6a84b">formants — what stays you</text>
  </g>
</svg>
