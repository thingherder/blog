    <g transform="rotate(-1.2 88 382)"><rect x="75" y="364" width="26" height="36" rx="3" fill="url(#tile)" stroke="#8a6d3b" stroke-width="1"/><text x="88" y="390" text-anchor="middle" class="t">m</text></g>
