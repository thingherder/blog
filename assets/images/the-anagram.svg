<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>The Anagram: a night sky with Saturn and its ring at upper right, drawn as Galileo's blurry "three-formed" planet beside the ringed planet Huygens later described. Across the middle runs a strip of cream paper holding thirty-seven loose letter tiles, Galileo's 1610 jumble smaismrmilmepoetaleumibunenugttauiras, pinned at the left by a red wax seal. Below, two readings of the same letters: Galileo's, "altissimum planetam tergeminum observavi", and Kepler's near-miss, "salve umbistineum geminatum Martia proles", marked one letter off.</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="0.55" stop-color="#1a1f3d"/>
      <stop offset="1" stop-color="#2b2238"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3e7c9"/>
      <stop offset="1" stop-color="#e2cfa3"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf4e2"/>
      <stop offset="1" stop-color="#e9d9b2"/>
    </linearGradient>
    <radialGradient id="planet" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#f6e2a8"/>
      <stop offset="0.7" stop-color="#d4a85e"/>
      <stop offset="1" stop-color="#8f6a35"/>
    </radialGradient>
    <radialGradient id="wax" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#d0423a"/>
      <stop offset="1" stop-color="#7a1712"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="4"/></filter>
    <style>
      .t { font-family: 'Courier New', monospace; font-size: 22px; fill: #3b2a14; font-weight: bold; }
      .cap { font-family: Georgia, 'Times New Roman', serif; fill: #e9dcc0; }
      .dim { font-family: Georgia, 'Times New Roman', serif; fill: #a99b85; font-style: italic; }
    </style>
  </defs>
  <rect width="1200" height="630" fill="url(#sky)"/>
  <g fill="#fff" opacity="0.75"><circle cx="599" cy="206" r="0.8"/><circle cx="679" cy="275" r="0.6"/><circle cx="940" cy="9" r="0.8"/><circle cx="649" cy="293" r="1"/><circle cx="971" cy="150" r="1"/><circle cx="976" cy="117" r="0.6"/><circle cx="757" cy="208" r="1"/><circle cx="550" cy="204" r="0.6"/><circle cx="1190" cy="55" r="1.3"/><circle cx="1135" cy="275" r="1.3"/><circle cx="437" cy="56" r="0.8"/><circle cx="1017" cy="214" r="0.8"/><circle cx="560" cy="14" r="0.6"/><circle cx="379" cy="269" r="1"/><circle cx="549" cy="234" r="0.8"/><circle cx="46" cy="24" r="0.6"/><circle cx="219" cy="107" r="1.3"/><circle cx="1014" cy="107" r="1.3"/><circle cx="827" cy="290" r="1.3"/><circle cx="1056" cy="118" r="0.8"/><circle cx="831" cy="233" r="0.6"/><circle cx="714" cy="61" r="0.6"/><circle cx="368" cy="276" r="0.8"/><circle cx="1046" cy="169" r="0.6"/><circle cx="1017" cy="133" r="0.6"/><circle cx="400" cy="74" r="0.6"/><circle cx="985" cy="179" r="0.8"/><circle cx="888" cy="291" r="0.8"/><circle cx="470" cy="55" r="0.8"/><circle cx="1065" cy="167" r="0.6"/><circle cx="353" cy="117" r="0.6"/><circle cx="1147" cy="297" r="1.3"/><circle cx="34" cy="17" r="1"/><circle cx="702" cy="237" r="1.3"/><circle cx="1088" cy="272" r="1.3"/><circle cx="368" cy="121" r="1"/><circle cx="934" cy="2" r="1"/><circle cx="389" cy="282" r="0.8"/><circle cx="467" cy="124" r="0.6"/><circle cx="762" cy="17" r="1.3"/><circle cx="357" cy="95" r="1"/><circle cx="1081" cy="147" r="0.8"/><circle cx="837" cy="237" r="1.3"/><circle cx="911" cy="5" r="1.3"/><circle cx="448" cy="145" r="0.6"/><circle cx="902" cy="158" r="0.6"/><circle cx="716" cy="171" r="1"/><circle cx="373" cy="22" r="1.3"/><circle cx="947" cy="179" r="0.8"/><circle cx="849" cy="216" r="1.3"/><circle cx="1078" cy="220" r="0.6"/><circle cx="1034" cy="226" r="0.8"/><circle cx="287" cy="1" r="1"/><circle cx="1104" cy="148" r="1.3"/><circle cx="565" cy="19" r="1.3"/><circle cx="607" cy="195" r="0.6"/><circle cx="1076" cy="43" r="1.3"/><circle cx="1042" cy="52" r="0.6"/><circle cx="40" cy="51" r="1"/><circle cx="1036" cy="240" r="0.8"/><circle cx="147" cy="153" r="1.3"/><circle cx="699" cy="37" r="0.6"/><circle cx="1069" cy="189" r="0.6"/><circle cx="49" cy="141" r="1.3"/><circle cx="957" cy="254" r="0.8"/><circle cx="1018" cy="198" r="1.3"/><circle cx="574" cy="262" r="1.3"/><circle cx="435" cy="290" r="1"/><circle cx="761" cy="115" r="0.6"/><circle cx="563" cy="177" r="1.3"/></g>

  <!-- Galileo's view, 1610: three blobs, "tergeminum" -->
  <g transform="translate(800 150)" filter="url(#blur)" opacity="0.85">
    <circle cx="-38" cy="0" r="11" fill="#d9b672"/>
    <circle cx="0" cy="0" r="24" fill="#e5c482"/>
    <circle cx="38" cy="0" r="11" fill="#d9b672"/>
  </g>
  <text x="800" y="208" text-anchor="middle" class="dim" font-size="15">1610: three-formed</text>

  <!-- arrow of time -->
  <path d="M 860 150 Q 900 120 945 140" fill="none" stroke="#7d7290" stroke-width="1.5" stroke-dasharray="4 5"/>

  <!-- Huygens's view, 1656/59: the ring -->
  <g transform="translate(1040 150) rotate(-14)">
    <ellipse cx="0" cy="0" rx="92" ry="24" fill="none" stroke="#c9b48a" stroke-width="7" opacity="0.9"/>
    <circle cx="0" cy="0" r="44" fill="url(#planet)"/>
    <path d="M -92 0 A 92 24 0 0 0 92 0" fill="none" stroke="#e8d6ac" stroke-width="7"/>
    <path d="M -80 6 A 80 18 0 0 0 80 6" fill="none" stroke="#a88f62" stroke-width="2" opacity="0.6"/>
  </g>
  <text x="1040" y="236" text-anchor="middle" class="dim" font-size="15">1659: the ring</text>

