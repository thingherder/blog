    <g transform="rotate(2.4 238 382)"><rect x="225" y="364" width="26" height="36" rx="3" fill="url(#tile)" stroke="#8a6d3b" stroke-width="1"/><text x="238" y="390" text-anchor="middle" class="t">r</text></g>
    <g transform="rotate(-3.6 268 382)"><rect x="255" y="364" width="26" height="36" rx="3" fill="url(#tile)" stroke="#8a6d3b" stroke-width="1"/><text x="268" y="390" text-anchor="middle" class="t">m</text></g>
    <g transform="rotate(-1.2 298 382)"><rect x="285" y="364" width="26" height="36" rx="3" fill="url(#tile)" stroke="#8a6d3b" stroke-width="1"/><text x="298" y="390" text-anchor="middle" class="t">i</text></g>
    <g transform="rotate(1.2 328 382)"><rect x="315" y="364" width="26" height="36" rx="3" fill="url(#tile)" stroke="#8a6d3b" stroke-width="1"/><text x="328" y="390" text-anchor="middle" class="t">l</text></g>
    <g transform="rotate(3.6 358 382)"><rect x="345" y="364" width="26" height="36" rx="3" fill="url(#tile)" stroke="#8a6d3b" stroke-width="1"/><text x="358" y="390" text-anchor="middle" class="t">m</text></g>
    <g transform="rotate(-2.4 388 382)"><rect x="375" y="364" width="26" height="36" rx="3" fill="url(#tile)" stroke="#8a6d3b" stroke-width="1"/><text x="388" y="390" text-anchor="middle" class="t">e</text></g>
    <g transform="rotate(0.0 418 382)"><rect x="405" y="364" width="26" height="36" rx="3" fill="url(#tile)" stroke="#8a6d3b" stroke-width="1"/><text x="418" y="390" text-anchor="middle" class="t">p</text></g>
    <g transform="rotate(2.4 448 382)"><rect x="435" y="364" width="26" height="36" rx="3" fill="url(#tile)" stroke="#8a6d3b" stroke-width="1"/><text x="448" y="390" text-anchor="middle" class="t">o</text></g>
    <g transform="rotate(-3.6 478 382)"><rect x="465" y="364" width="26" height="36" rx="3" fill="url(#tile)" stroke="#8a6d3b" stroke-width="1"/><text x="478" y="390" text-anchor="middle" class="t">e</text></g>
    <g transform="rotate(-1.2 508 382)"><rect x="495" y="364" width="26" height="36" rx="3" fill="url(#tile)" stroke="#8a6d3b" stroke-width="1"/><text x="508" y="390" text-anchor="middle" class="t">t</text></g>
    <g transform="rotate(1.2 538 382)"><rect x="525" y="364" width="26" height="36" rx="3" fill="url(#tile)" stroke="#8a6d3b" stroke-width="1"/><text x="538" y="390" text-anchor="middle" class="t">a</text></g>
    <g transform="rotate(3.6 568 382)"><rect x="555" y="364" width="26" height="36" rx="3" fill="url(#tile)" stroke="#8a6d3b" stroke-width="1"/><text x="568" y="390" text-anchor="middle" class="t">l</text></g>
    <g transform="rotate(-2.4 598 382)"><rect x="585" y="364" width="26" height="36" rx="3" fill="url(#tile)" stroke="#8a6d3b" stroke-width="1"/><text x="598" y="390" text-anchor="middle" class="t">e</text></g>
    <g transform="rotate(0.0 628 382)"><rect x="615" y="364" width="26" height="36" rx="3" fill="url(#tile)" stroke="#8a6d3b" stroke-width="1"/><text x="628" y="390" text-anchor="middle" class="t">u</text></g>
    <g transform="rotate(2.4 658 382)"><rect x="645" y="364" width="26" height="36" rx="3" fill="url(#tile)" stroke="#8a6d3b" stroke-width="1"/><text x="658" y="390" text-anchor="middle" class="t">m</text></g>
    <g transform="rotate(-3.6 688 382)"><rect x="675" y="364" width="26" height="36" rx="3" fill="url(#tile)" stroke="#8a6d3b" stroke-width="1"/><text x="688" y="390" text-anchor="middle" class="t">i</text></g>
    <g transform="rotate(-1.2 718 382)"><rect x="705" y="364" width="26" height="36" rx="3" fill="url(#tile)" stroke="#8a6d3b" stroke-width="1"/><text x="718" y="390" text-anchor="middle" class="t">b</text></g>
    <g transform="rotate(1.2 748 382)"><rect x="735" y="364" width="26" height="36" rx="3" fill="url(#tile)" stroke="#8a6d3b" stroke-width="1"/><text x="748" y="390" text-anchor="middle" class="t">u</text></g>
    <g transform="rotate(3.6 778 382)"><rect x="765" y="364" width="26" height="36" rx="3" fill="url(#tile)" stroke="#8a6d3b" stroke-width="1"/><text x="778" y="390" text-anchor="middle" class="t">n</text></g>
    <g transform="rotate(-2.4 808 382)"><rect x="795" y="364" width="26" height="36" rx="3" fill="url(#tile)" stroke="#8a6d3b" stroke-width="1"/><text x="808" y="390" text-anchor="middle" class="t">e</text></g>
    <g transform="rotate(0.0 838 382)"><rect x="825" y="364" width="26" height="36" rx="3" fill="url(#tile)" stroke="#8a6d3b" stroke-width="1"/><text x="838" y="390" text-anchor="middle" class="t">n</text></g>
    <g transform="rotate(2.4 868 382)"><rect x="855" y="364" width="26" height="36" rx="3" fill="url(#tile)" stroke="#8a6d3b" stroke-width="1"/><text x="868" y="390" text-anchor="middle" class="t">u</text></g>
    <g transform="rotate(-3.6 898 382)"><rect x="885" y="364" width="26" height="36" rx="3" fill="url(#tile)" stroke="#8a6d3b" stroke-width="1"/><text x="898" y="390" text-anchor="middle" class="t">g</text></g>
    <g transform="rotate(-1.2 928 382)"><rect x="915" y="364" width="26" height="36" rx="3" fill="url(#tile)" stroke="#8a6d3b" stroke-width="1"/><text x="928" y="390" text-anchor="middle" class="t">t</text></g>
    <g transform="rotate(1.2 958 382)"><rect x="945" y="364" width="26" height="36" rx="3" fill="url(#tile)" stroke="#8a6d3b" stroke-width="1"/><text x="958" y="390" text-anchor="middle" class="t">t</text></g>
    <g transform="rotate(3.6 988 382)"><rect x="975" y="364" width="26" height="36" rx="3" fill="url(#tile)" stroke="#8a6d3b" stroke-width="1"/><text x="988" y="390" text-anchor="middle" class="t">a</text></g>
    <g transform="rotate(-2.4 1018 382)"><rect x="1005" y="364" width="26" height="36" rx="3" fill="url(#tile)" stroke="#8a6d3b" stroke-width="1"/><text x="1018" y="390" text-anchor="middle" class="t">u</text></g>
    <g transform="rotate(0.0 1048 382)"><rect x="1035" y="364" width="26" height="36" rx="3" fill="url(#tile)" stroke="#8a6d3b" stroke-width="1"/><text x="1048" y="390" text-anchor="middle" class="t">i</text></g>
    <g transform="rotate(2.4 1078 382)"><rect x="1065" y="364" width="26" height="36" rx="3" fill="url(#tile)" stroke="#8a6d3b" stroke-width="1"/><text x="1078" y="390" text-anchor="middle" class="t">r</text></g>
    <g transform="rotate(-3.6 1108 382)"><rect x="1095" y="364" width="26" height="36" rx="3" fill="url(#tile)" stroke="#8a6d3b" stroke-width="1"/><text x="1108" y="390" text-anchor="middle" class="t">a</text></g>
    <g transform="rotate(-1.2 1138 382)"><rect x="1125" y="364" width="26" height="36" rx="3" fill="url(#tile)" stroke="#8a6d3b" stroke-width="1"/><text x="1138" y="390" text-anchor="middle" class="t">s</text></g>

  <!-- wax seal -->
  <g transform="translate(40 440)">
    <path d="M -30 -4 C -36 -26 -14 -38 4 -34 C 26 -36 38 -16 32 4 C 36 24 16 36 -2 33 C -24 36 -38 16 -30 -4 Z" fill="url(#wax)"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#5c0f0b" stroke-width="2"/>
    <text x="0" y="7" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#5c0f0b" font-weight="bold">G</text>
  </g>

  <!-- two readings -->
  <text x="600" y="500" text-anchor="middle" class="cap" font-size="22">altissimum planetam tergeminum observavi</text>
  <text x="600" y="526" text-anchor="middle" class="dim" font-size="15">Galileo's opening: "I have observed the highest planet three-formed"</text>
  <text x="600" y="565" text-anchor="middle" class="cap" font-size="19" opacity="0.6">salve umbistineum geminatum Martia proles</text>
  <text x="600" y="589" text-anchor="middle" class="dim" font-size="15">Kepler's reading: "hail, double knob, children of Mars" (one letter off)</text>

  <text x="40" y="60" class="cap" font-size="40" letter-spacing="6">THE ANAGRAM</text>
  <text x="42" y="90" class="dim" font-size="16">a claim you can hold before you can read it</text>
</svg>
