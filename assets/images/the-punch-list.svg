<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
<title>The Punch List: a calm architectural elevation of a small finished building at dusk, windows lit warm yellow, a figure visible inside one window. Squares of blue painter's tape mark small flaws: a missing outlet cover, a sticking door, a scuff on the wall. At right, a clipboard holds a certificate headed "Substantial Completion" with a short checklist below: "outlet cover", "door sticks", "lobby scuff — repainted 3x", and an empty signature line labeled "not the builder". Title at lower left reads "The Punch List" with the subtitle "people live here anyway."</title>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d2a44"/><stop offset="0.7" stop-color="#3c4a68"/><stop offset="1" stop-color="#6b6a78"/></linearGradient>
<linearGradient id="facade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9d2c3"/><stop offset="1" stop-color="#b9b1a1"/></linearGradient>
<radialGradient id="lamp" cx="0.5" cy="0.4" r="0.7"><stop offset="0" stop-color="#ffe7a3"/><stop offset="1" stop-color="#e8a94a"/></radialGradient>
<linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf8ef"/><stop offset="1" stop-color="#ece6d6"/></linearGradient>
</defs>
<rect width="1200" height="630" fill="url(#sky)"/>
<g fill="#ffffff" opacity="0.6"><circle cx="90" cy="60" r="1.4"/><circle cx="240" cy="110" r="1"/><circle cx="420" cy="48" r="1.2"/><circle cx="610" cy="90" r="1"/><circle cx="700" cy="40" r="1.3"/><circle cx="330" cy="30" r="0.9"/></g>
<rect x="0" y="520" width="1200" height="110" fill="#2b2f2a"/>
<rect x="0" y="516" width="1200" height="6" fill="#4a4f45"/>
<!-- building -->
<polygon points="110,250 420,140 730,250" fill="#5a3f36"/>
<rect x="130" y="250" width="580" height="270" fill="url(#facade)"/>
<rect x="130" y="250" width="580" height="10" fill="#a39a88"/>
<g stroke="#8c8473" stroke-width="3">
<rect x="175" y="300" width="110" height="90" fill="url(#lamp)"/><line x1="230" y1="300" x2="230" y2="390"/><line x1="175" y1="345" x2="285" y2="345"/>
<rect x="555" y="300" width="110" height="90" fill="url(#lamp)"/><line x1="610" y1="300" x2="610" y2="390"/><line x1="555" y1="345" x2="665" y2="345"/>
<rect x="380" y="300" width="80" height="70" fill="url(#lamp)"/>
</g>
<!-- figure in window -->
<g fill="#4d3a2c" opacity="0.75"><circle cx="595" cy="358" r="9"/><path d="M582,390 q13,-28 26,0 z"/></g>
<!-- door -->
<rect x="385" y="400" width="70" height="120" fill="#6b4a3a" stroke="#4a3328" stroke-width="3" transform="rotate(-1.5 420 460)"/>
<circle cx="443" cy="462" r="4" fill="#d8b46a"/>
<!-- outlet plate missing: bare box -->
<rect x="250" y="455" width="18" height="26" fill="#6c6658" stroke="#555" stroke-width="1.5"/>
<!-- scuff -->
<path d="M520,470 q20,-6 38,2 q-16,4 -34,2 z" fill="#8b8576" opacity="0.8"/>
<path d="M512,466 l52,-1 l2,16 l-52,2 z" fill="none" stroke="#c9c2b2" stroke-width="7" opacity="0.6"/>
<!-- blue tape marks -->
<g fill="#3d7fd6" opacity="0.92">
<rect x="236" y="444" width="24" height="9" transform="rotate(-12 248 448)"/><rect x="258" y="484" width="24" height="9" transform="rotate(10 270 488)"/>
<rect x="452" y="392" width="26" height="9" transform="rotate(14 465 396)"/>
<rect x="498" y="458" width="24" height="9" transform="rotate(-8 510 462)"/><rect x="560" y="478" width="24" height="9" transform="rotate(6 572 482)"/>
</g>
<!-- clipboard -->
<g transform="translate(790 120) rotate(2)">
<rect x="0" y="0" width="330" height="400" rx="14" fill="#7a5a3c"/>
<rect x="16" y="28" width="298" height="358" fill="url(#paper)"/>
<rect x="115" y="-10" width="100" height="34" rx="6" fill="#9ea3aa" stroke="#6d7279" stroke-width="2"/>
<g font-family="Georgia, serif" fill="#2c2a26">
<text x="165" y="70" font-size="21" text-anchor="middle" font-style="italic">Certificate of</text>
<text x="165" y="98" font-size="21" text-anchor="middle" font-weight="bold">Substantial Completion</text>
<line x1="40" y1="114" x2="290" y2="114" stroke="#b5ab95" stroke-width="1.5"/>
<text x="40" y="146" font-size="16" fill="#5d574c">Punch list attached:</text>
</g>
<g font-family="'Courier New', monospace" font-size="16" fill="#2c2a26">
<rect x="40" y="166" width="14" height="14" fill="none" stroke="#2c2a26" stroke-width="1.5"/><text x="64" y="179">outlet cover</text>
<rect x="40" y="198" width="14" height="14" fill="none" stroke="#2c2a26" stroke-width="1.5"/><text x="64" y="211">door sticks</text>
<rect x="40" y="230" width="14" height="14" fill="none" stroke="#2c2a26" stroke-width="1.5"/><text x="64" y="243">lobby scuff</text>
<text x="64" y="264" font-size="14" fill="#b0402e">  repainted 3x</text>
<rect x="40" y="284" width="14" height="14" fill="#3d7fd6" opacity="0.85"/><text x="64" y="297">blue tape: ____</text>
</g>
<line x1="40" y1="350" x2="290" y2="350" stroke="#2c2a26" stroke-width="1.5"/>
<text x="40" y="370" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#5d574c">signed — not the builder</text>
</g>
<!-- title -->
<g font-family="Georgia, serif">
<text x="60" y="580" font-size="46" fill="#f4efe2">The Punch List</text>
<text x="62" y="610" font-size="20" font-style="italic" fill="#c9c2b2">people live here anyway.</text>
</g>
</svg>
