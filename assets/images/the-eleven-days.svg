<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
<title>The Eleven Days: an old printed almanac page for September 1752 on cream paper. The grid runs Tuesday 1, Wednesday 2, then straight to Thursday 14 and on to 30. To the right, the missing numbers 3 through 13 drift away like loose type, fading as they go. Title at lower left reads "The Eleven Days" with the subtitle "September 1752, as printed."</title>
