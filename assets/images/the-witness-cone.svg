<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-label="The view through a round kiln spy hole into a glowing orange-white firing chamber. On a kiln shelf, three slender ceramic cones stand in a clay pad: the left guide cone has slumped fully over, the middle firing cone is bowed with its tip just touching the shelf, and the right guard cone still stands upright. A dark band across the bottom of the hole suggests the dark glass a potter must look through to see the cones against the glare.">
  <defs>
    <radialGradient id="fire" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#fff6d8"/>
      <stop offset="40%" stop-color="#ffc66a"/>
      <stop offset="80%" stop-color="#f07a26"/>
      <stop offset="100%" stop-color="#b8431a"/>
    </radialGradient>
    <linearGradient id="brick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1714"/>
      <stop offset="100%" stop-color="#120e0c"/>
    </linearGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffe7b0"/>
      <stop offset="100%" stop-color="#e99a48"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1a14" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0d1a14" stop-opacity="0.55"/>
    </linearGradient>
    <clipPath id="hole"><circle cx="400" cy="205" r="168"/></clipPath>
  </defs>

  <!-- kiln wall: firebrick courses -->
  <rect width="800" height="420" fill="url(#brick)"/>
  <g stroke="#2b221d" stroke-width="2">
    <line x1="0" y1="70" x2="800" y2="70"/><line x1="0" y1="140" x2="800" y2="140"/>
    <line x1="0" y1="210" x2="800" y2="210"/><line x1="0" y1="280" x2="800" y2="280"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="90" y1="0" x2="90" y2="70"/><line x1="250" y1="0" x2="250" y2="70"/><line x1="560" y1="0" x2="560" y2="70"/><line x1="710" y1="0" x2="710" y2="70"/>
    <line x1="170" y1="70" x2="170" y2="140"/><line x1="640" y1="70" x2="640" y2="140"/>
    <line x1="90" y1="140" x2="90" y2="210"/><line x1="710" y1="140" x2="710" y2="210"/>
    <line x1="170" y1="210" x2="170" y2="280"/><line x1="640" y1="210" x2="640" y2="280"/>
    <line x1="90" y1="280" x2="90" y2="350"/><line x1="710" y1="280" x2="710" y2="350"/>
    <line x1="170" y1="350" x2="170" y2="420"/><line x1="400" y1="350" x2="400" y2="420"/><line x1="640" y1="350" x2="640" y2="420"/>
  </g>

  <!-- spy hole rim -->
  <circle cx="400" cy="205" r="180" fill="#0a0807"/>
  <circle cx="400" cy="205" r="174" fill="none" stroke="#3a2c24" stroke-width="6"/>

  <g clip-path="url(#hole)">
    <!-- the glare -->
    <rect x="220" y="30" width="360" height="360" fill="url(#fire)"/>
    <!-- kiln shelf -->
    <rect x="220" y="268" width="360" height="22" fill="#d9792e"/>
    <rect x="220" y="290" width="360" height="110" fill="#a8461c"/>
    <!-- clay pad -->
    <path d="M300,268 Q300,252 316,250 L486,250 Q502,252 502,268 Z" fill="#f2a654"/>

    <!-- guide cone: fully slumped over to the left -->
    <path d="M330,252 L348,252 Q350,232 336,222 Q312,214 286,232 Q282,238 288,240 Q312,228 330,236 Z" fill="url(#cone)" stroke="#8a3a12" stroke-opacity="0.55" stroke-width="1.5"/>
    <!-- firing cone: bowed, tip just touching the shelf -->
    <path d="M394,252 L412,252 Q414,196 392,184 Q368,176 358,214 Q352,236 356,262 L362,262 Q366,226 374,206 Q384,196 394,212 Z" fill="url(#cone)" stroke="#8a3a12" stroke-opacity="0.55" stroke-width="1.5"/>
    <!-- guard cone: still standing -->
    <path d="M458,252 L478,252 L462,150 Z" fill="url(#cone)" stroke="#8a3a12" stroke-opacity="0.55" stroke-width="1.5"/>

    <!-- dark glass band -->
    <rect x="220" y="230" width="360" height="170" fill="url(#glass)"/>
  </g>

  <!-- labels -->
  <g font-family="Georgia, serif" font-size="13" fill="#c9a98a" text-anchor="middle" letter-spacing="1">
    <text x="316" y="404">guide</text>
    <text x="384" y="404">firing</text>
    <text x="468" y="404">guard</text>
  </g>
  <text x="400" y="22" font-family="Georgia, serif" font-size="15" fill="#e7c8a4" text-anchor="middle" letter-spacing="3">THE WITNESS CONE</text>
</svg>
