<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="An aerial view of a meandering river running left to right across a dark field, its two banks in slightly different earth tones like two adjoining territories. The water is a band of blue-green that curves through several bends. A pale straight dashed line runs down the geometric middle of the river. A separate glowing deep-blue line — the thalweg — winds through the water, swinging wide to the outside of every bend and diverging clearly from the straight midline, tracing the deepest channel. Faint depth contours nest inside the curves, and a small drifting shape follows the deep line downstream.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1622"/>
      <stop offset="1" stop-color="#070d15"/>
    </linearGradient>
    <linearGradient id="bankN" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3320"/>
      <stop offset="1" stop-color="#26210f"/>
    </linearGradient>
    <linearGradient id="bankS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33291f"/>
      <stop offset="1" stop-color="#211913"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b6d78"/>
      <stop offset="0.5" stop-color="#1d5560"/>
      <stop offset="1" stop-color="#123c47"/>
    </linearGradient>
    <linearGradient id="thal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fe4ff" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#8ff0ff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#7fe4ff" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#sky)"/>

  <!-- northern territory -->
  <path d="M0,0 H1200 V0
           L1200,235
           C1040,205 980,150 820,175
           C660,200 600,300 440,300
           C300,300 250,215 100,235
           L0,255 Z" fill="url(#bankN)"/>
  <!-- southern territory -->
  <path d="M0,630 H1200 V630
           L1200,340
           C1040,315 980,270 820,290
           C660,310 600,405 440,405
           C300,405 250,330 100,350
           L0,368 Z" fill="url(#bankS)"/>

  <!-- the water -->
  <path d="M0,255
           C100,235 250,215 400,300
           C600,410 660,200 820,175
           C980,150 1040,205 1200,235
           L1200,340
           C1040,315 980,270 820,290
           C660,310 600,410 400,405
           C250,330 100,350 0,368 Z" fill="url(#water)"/>

  <!-- depth contours nested toward the deep channel -->
  <g fill="none" stroke="#5fb3bf" stroke-opacity="0.28" stroke-width="2">
    <path d="M40,300 C220,270 300,255 420,320 C620,430 700,250 840,222 C980,196 1050,240 1160,262"/>
    <path d="M60,320 C230,296 320,290 430,338 C620,438 720,282 850,256 C980,232 1050,262 1150,280"/>
  </g>

  <!-- geometric midline: straight, dashed, sails down the empty center -->
  <line x1="0" y1="311" x2="1200" y2="298"
        stroke="#d8e4e8" stroke-opacity="0.5" stroke-width="2.4"
        stroke-dasharray="10 12"/>
  <text x="18" y="300" fill="#d8e4e8" fill-opacity="0.55"
        font-family="Georgia, serif" font-size="17" font-style="italic">geometric midline</text>

  <!-- the thalweg: winding deep line, swinging to the outside of each bend -->
  <path d="M0,262
           C120,244 250,232 400,332
           C560,438 690,236 830,206
           C980,174 1050,232 1200,258"
        fill="none" stroke="url(#thal)" stroke-width="5.5"
        stroke-linecap="round" filter="url(#glow)"/>
  <text x="470" y="470" fill="#8ff0ff" fill-opacity="0.9"
        font-family="Georgia, serif" font-size="22" font-style="italic">the thalweg</text>

  <!-- a shape drifting down the deep line -->
  <g transform="translate(690,222) rotate(-14)">
    <ellipse cx="0" cy="0" rx="11" ry="4.5" fill="#f2fbff" fill-opacity="0.92"/>
    <ellipse cx="0" cy="0" rx="24" ry="8" fill="none" stroke="#bfeeff" stroke-opacity="0.4" stroke-width="1.4"/>
  </g>
</svg>
