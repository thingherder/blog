<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="A side-on cross-section of a hillside in the rain. The land slopes down from upper left to lower right. Rain falls from a grey-blue sky. Partway down the slope a shallow level trough — a swale — has been cut across the hill; it holds a thin sheet of pooled water lying dead level while the ground around it keeps falling. Below the swale a mounded lip of earth, the berm, carries a young tree with green leaves. From the base of the swale, soft blue arrows and a widening plume of moisture soak straight down through the warm brown soil into a darker damp subsoil and reach a pale blue band of groundwater near the bottom. To the right, away from the swale, thin runoff lines sheet uselessly off the bare slope toward the edge. The tree's roots reach down into the damp ground fed by the swale.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b6f82"/>
      <stop offset="1" stop-color="#8fa1ad"/>
    </linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5a34"/>
      <stop offset="0.55" stop-color="#6d4526"/>
      <stop offset="1" stop-color="#4a2f1a"/>
    </linearGradient>
    <linearGradient id="damp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3826"/>
      <stop offset="1" stop-color="#33302a"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe0e6"/>
      <stop offset="1" stop-color="#7db3c0"/>
    </linearGradient>
    <radialGradient id="plume" cx="0.5" cy="0" r="1">
      <stop offset="0" stop-color="#6fb0c2" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6fb0c2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9d3d8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7fb0bb" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="1200" height="630" fill="url(#sky)"/>

  <!-- rain -->
  <g stroke="#cdd9de" stroke-width="2" stroke-linecap="round" opacity="0.5">
    <line x1="120" y1="30" x2="108" y2="80"/>
    <line x1="230" y1="10" x2="218" y2="60"/>
    <line x1="340" y1="40" x2="328" y2="90"/>
    <line x1="470" y1="15" x2="458" y2="65"/>
    <line x1="590" y1="35" x2="578" y2="85"/>
    <line x1="700" y1="12" x2="688" y2="62"/>
    <line x1="820" y1="38" x2="808" y2="88"/>
    <line x1="940" y1="18" x2="928" y2="68"/>
    <line x1="1060" y1="34" x2="1048" y2="84"/>
    <line x1="180" y1="70" x2="168" y2="120"/>
    <line x1="410" y1="80" x2="398" y2="130"/>
    <line x1="650" y1="72" x2="638" y2="122"/>
    <line x1="880" y1="82" x2="868" y2="132"/>
    <line x1="1010" y1="70" x2="998" y2="120"/>
  </g>

  <!-- soil body: slope descending left-to-right with a level swale trough cut into it -->
  <path d="M0,230
           L360,300
           C440,322 500,332 545,352
           L560,392
           L740,392
           L770,356
           C820,342 900,360 1000,388
           C1080,410 1140,428 1200,442
           L1200,630 L0,630 Z"
        fill="url(#soil)"/>

  <!-- damp subsoil wedge beneath the swale -->
  <path d="M470,470 C560,430 720,430 820,478 C760,600 560,600 470,470 Z"
        fill="url(#damp)" opacity="0.85"/>

  <!-- infiltration plume soaking down from the swale base -->
  <path d="M560,392 L740,392 C760,520 720,600 650,610 C580,600 540,520 560,392 Z"
        fill="url(#plume)"/>

  <!-- groundwater band near the bottom -->
  <rect x="0" y="560" width="1200" height="70" fill="url(#ground)" opacity="0.55"/>
  <path d="M0,566 C200,556 400,576 600,566 C800,556 1000,576 1200,566 L1200,560 L0,560 Z"
        fill="#bfe0e6" opacity="0.5"/>

  <!-- pooled water sitting DEAD LEVEL in the swale trough -->
  <rect x="560" y="374" width="180" height="18" rx="4" fill="url(#water)"/>
  <line x1="560" y1="374" x2="740" y2="374" stroke="#e8f4f6" stroke-width="2" opacity="0.8"/>

  <!-- level reference dashes extending from the water surface, to read as "on contour" -->
  <g stroke="#e8f4f6" stroke-width="1.5" stroke-dasharray="7 9" opacity="0.5">
    <line x1="470" y1="374" x2="560" y2="374"/>
    <line x1="740" y1="374" x2="835" y2="374"/>
  </g>

  <!-- downward infiltration arrows -->
  <g stroke="#dff0f3" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <line x1="605" y1="404" x2="605" y2="474"/>
    <polygon points="605,486 598,470 612,470" fill="#dff0f3" stroke="none"/>
    <line x1="650" y1="404" x2="650" y2="500"/>
    <polygon points="650,512 643,496 657,496" fill="#dff0f3" stroke="none"/>
    <line x1="695" y1="404" x2="695" y2="474"/>
    <polygon points="695,486 688,470 702,470" fill="#dff0f3" stroke="none"/>
  </g>

  <!-- berm: mounded lip just downhill of the swale, carrying the tree -->
  <path d="M740,392 C770,360 812,352 852,366 C878,376 892,392 900,392 Z"
        fill="#6d4526"/>

  <!-- young tree on the berm -->
  <g>
    <!-- roots reaching into damp ground -->
    <g stroke="#5a3a20" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8">
      <path d="M812,366 C806,410 782,440 748,470"/>
      <path d="M812,366 C816,412 826,446 690,486" opacity="0.6"/>
      <path d="M812,366 C812,420 808,470 806,520"/>
    </g>
    <!-- trunk -->
    <path d="M807,368 L806,300 M807,340 L807,300" stroke="#4a2f1a" stroke-width="7" stroke-linecap="round" fill="none"/>
    <rect x="803" y="298" width="8" height="72" rx="3" fill="#4a2f1a"/>
    <!-- branches -->
    <g stroke="#4a2f1a" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M807,318 C790,306 782,296 776,286"/>
      <path d="M807,326 C826,316 834,306 842,296"/>
      <path d="M807,302 C800,290 796,282 794,272"/>
    </g>
    <!-- foliage -->
    <g fill="#5c8f4a">
      <circle cx="778" cy="280" r="26"/>
      <circle cx="836" cy="288" r="24"/>
      <circle cx="806" cy="258" r="30"/>
      <circle cx="812" cy="292" r="24"/>
    </g>
    <g fill="#6fa657" opacity="0.9">
      <circle cx="796" cy="266" r="18"/>
      <circle cx="824" cy="272" r="16"/>
    </g>
  </g>

  <!-- runoff sheeting uselessly off the bare slope to the right (no swale there) -->
  <g stroke="#cdd9de" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.55">
    <path d="M950,378 C1010,396 1070,410 1130,420"/>
    <path d="M980,392 C1035,408 1090,420 1150,430"/>
    <path d="M1010,406 C1060,420 1110,430 1165,440"/>
  </g>
  <!-- runoff arrowhead -->
  <polygon points="1168,440 1150,432 1153,448" fill="#cdd9de" opacity="0.6"/>

  <!-- subtle contour label line across the swale -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#f0f5f6" opacity="0.85">
    <text x="600" y="356" font-size="19" font-style="italic" text-anchor="middle">on contour · dead level</text>
  </g>
</svg>
