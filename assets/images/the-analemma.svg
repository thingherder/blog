<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="The Analemma — a deep dusk sky, graded from indigo at the top to a warm ember band at the horizon. Down the exact center falls a faint pale vertical line, the clock's noon. Strung along it, but never quite on it, is a slender lopsided figure-eight of small golden suns: a tight bright loop high on the left where the summer sun rides, opening into a broader loop low and to the right where the winter sun sinks. Each sun is a single day photographed at the same clock time for a year; brighter and larger at the two solstice turns, fainter through the crossings. The whole eight leans off the vertical noon line, tracing the gap between the true sun and the clock's invented one.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141834"/>
      <stop offset="0.45" stop-color="#20233f"/>
      <stop offset="0.78" stop-color="#4a3358"/>
      <stop offset="0.92" stop-color="#a35a3e"/>
      <stop offset="1" stop-color="#d98b4a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9b0" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#f6c24a" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset="0.55" stop-color="#ffd266"/>
      <stop offset="1" stop-color="#e79a35"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

