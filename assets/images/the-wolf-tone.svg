<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="The Wolf Tone — a close, raking view across the lower body of a cello in deep amber varnish, one carved f-hole curling on the left. A single low string runs horizontally across the plate, over a dark maple bridge near the right. Along most of its length the string carries a clean, even waveform, but as it approaches the bridge the wave breaks into a beating envelope — swelling and collapsing, swelling and collapsing — the visible howl of the wolf tone where the string and the resonating body fight for the same pitch. Behind the bridge, on the short unplayed afterlength of string running to the tailpiece, a small brass cylinder — a wolf eliminator — is clamped, glinting, the one small tuned weight set in the quiet margin that steadies the note. Warm light rakes across the varnish.">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a3d18"/>
      <stop offset="0.45" stop-color="#5f2d11"/>
      <stop offset="1" stop-color="#3a1c0b"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.42" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#f6c06a" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#e0973f" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#e0973f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset="0.4" stop-color="#d7a53f"/>
      <stop offset="1" stop-color="#7d5c18"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2efe8"/>
      <stop offset="0.5" stop-color="#b9b2a4"/>
      <stop offset="1" stop-color="#726c5f"/>
    </linearGradient>
    <linearGradient id="bridgegrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3517"/>
      <stop offset="1" stop-color="#2c1809"/>
    </linearGradient>
  </defs>

  <!-- cello top plate -->
  <rect x="0" y="0" width="1200" height="630" fill="url(#wood)"/>

  <!-- long figured grain of the belly -->
  <g stroke="#8a4a20" stroke-width="2" opacity="0.30">
    <line x1="0" y1="70" x2="1200" y2="58"/>
    <line x1="0" y1="140" x2="1200" y2="126"/>
    <line x1="0" y1="215" x2="1200" y2="205"/>
    <line x1="0" y1="300" x2="1200" y2="296"/>
    <line x1="0" y1="470" x2="1200" y2="480"/>
    <line x1="0" y1="545" x2="1200" y2="560"/>
    <line x1="0" y1="605" x2="1200" y2="620"/>
  </g>
  <g stroke="#3a1d0a" stroke-width="1.4" opacity="0.35">
    <line x1="0" y1="105" x2="1200" y2="93"/>
    <line x1="0" y1="178" x2="1200" y2="166"/>
    <line x1="0" y1="255" x2="1200" y2="248"/>
    <line x1="0" y1="510" x2="1200" y2="522"/>
    <line x1="0" y1="578" x2="1200" y2="592"/>
  </g>

  <!-- warm bloom of raking light -->
  <ellipse cx="500" cy="200" rx="720" ry="300" fill="url(#bloom)"/>

  <!-- carved f-hole, left of center -->
  <g fill="#1a0d05" opacity="0.92">
    <path d="M232 150
             C 210 210, 250 250, 232 300
             C 214 350, 250 390, 224 452
             C 214 476, 190 480, 176 470
             C 196 470, 208 452, 210 430
             C 226 380, 190 344, 214 296
             C 236 250, 200 214, 224 168
             C 232 150, 240 146, 250 150
             C 244 146, 236 146, 232 150 Z"/>
    <circle cx="243" cy="158" r="15"/>
    <circle cx="205" cy="462" r="15"/>
  </g>
  <!-- little nick marks at the eyes -->
  <g stroke="#e9b262" stroke-width="2" opacity="0.5">
    <line x1="228" y1="158" x2="258" y2="158"/>
    <line x1="190" y1="462" x2="220" y2="462"/>
  </g>

  <!-- the speaking length of the low string -->
  <line x1="0" y1="330" x2="905" y2="330" stroke="#241206" stroke-width="9" opacity="0.5"/>

  <!-- clean even wave along the open string, breaking into a beating envelope near the bridge -->
  <!-- envelope guides (invisible intent): steady amplitude to ~560, then amplitude-modulated to the bridge -->
  <path d="M20 330
           Q 55 300, 90 330 T 160 330 T 230 330 T 300 330 T 370 330 T 440 330 T 510 330
           Q 545 302, 580 330
           Q 606 348, 632 330
           Q 645 322, 658 330
           Q 672 300, 686 330
           Q 700 356, 714 330
           Q 723 326, 732 330
           Q 742 306, 752 330
           Q 762 352, 772 330
           Q 780 328, 788 330
           Q 797 312, 806 330
           Q 815 348, 824 330
           Q 831 328, 838 330
           Q 846 322, 854 330
           Q 862 338, 870 330"
        fill="none" stroke="#ffd27a" stroke-width="4.5" stroke-linecap="round" opacity="0.95"/>

  <!-- faint mirror of the beating region, out of phase — the fight made visible -->
  <path d="M510 330
           Q 545 358, 580 330
           Q 606 312, 632 330
           Q 645 338, 658 330
           Q 672 360, 686 330
           Q 700 304, 714 330
           Q 723 334, 732 330
           Q 742 354, 752 330
           Q 762 308, 772 330
           Q 780 332, 788 330
           Q 797 348, 806 330
           Q 815 312, 824 330"
        fill="none" stroke="#c8621f" stroke-width="2.6" stroke-linecap="round" opacity="0.55"/>

  <!-- the bridge -->
  <g>
    <path d="M905 262
             L 945 262
             L 940 300
             Q 962 312, 940 326
             L 946 396
             L 904 396
             L 910 326
             Q 888 312, 910 300 Z"
          fill="url(#bridgegrad)" stroke="#1e0f06" stroke-width="2"/>
    <!-- bridge cutouts -->
    <circle cx="925" cy="298" r="8" fill="#1a0d05"/>
    <circle cx="912" cy="352" r="6" fill="#1a0d05"/>
    <circle cx="938" cy="352" r="6" fill="#1a0d05"/>
  </g>

  <!-- afterlength: the short unplayed stub of string behind the bridge, running to the tailpiece -->
  <line x1="945" y1="330" x2="1150" y2="356" stroke="#241206" stroke-width="8" opacity="0.55"/>
  <line x1="945" y1="330" x2="1150" y2="356" stroke="#e9c98a" stroke-width="2" opacity="0.55"/>

  <!-- the wolf eliminator: a small brass cylinder clamped on the afterlength -->
  <g transform="translate(1040 342) rotate(7)">
    <rect x="-34" y="-15" width="68" height="30" rx="8" fill="url(#brass)" stroke="#5c4210" stroke-width="2"/>
    <rect x="-24" y="-11" width="7" height="22" rx="3" fill="#fff2c8" opacity="0.7"/>
    <rect x="18" y="-11" width="4" height="22" rx="2" fill="#5c4210" opacity="0.6"/>
    <!-- the set screw that clamps it to the string -->
    <circle cx="-2" cy="-15" r="5" fill="url(#steel)" stroke="#4f4a3e" stroke-width="1.2"/>
  </g>

  <!-- tailpiece edge, far right -->
  <path d="M1150 300 L 1200 292 L 1200 420 L 1150 408 Q 1136 354, 1150 300 Z"
        fill="#241206" opacity="0.85" stroke="#12080300" stroke-width="0"/>
  <line x1="1150" y1="300" x2="1150" y2="408" stroke="#e9b262" stroke-width="2" opacity="0.4"/>

  <!-- soft vignette -->
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="#1a0d05" stroke-width="46" opacity="0.28"/>
</svg>
