<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
<title>The Silbo: a deep volcanic ravine on La Gomera in late afternoon light. On the left ridge a small figure stands with a finger in the mouth and one hand cupped beside the face; on the right ridge a second figure listens from a terrace by a white farmhouse. Across the gap runs a single bright whistled line, a pitch contour that rises, holds, dips, breaks and rises again. Far below, a dotted footpath zigzags down one side, across the stream bed, and up the other. Title at lower left reads "The Silbo" with the subtitle "a sentence across a ravine."</title>
