<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="A warm dark field holding a large metallic amber wheel at center, its rim carved with a ring of evenly spaced rounded notches. Descending from above, a coiled spring presses a small glowing gold ball down into the topmost notch, where it is seated and held. A faint curved arrow arcs around the right side of the wheel, showing that it can still be turned; the other notches sit in shadow, each one a position the wheel could click into but has not. The seated ball glows; the wheel is settled at one chosen place.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#221a12"/>
      <stop offset="0.55" stop-color="#171008"/>
      <stop offset="1" stop-color="#0f0a05"/>
    </linearGradient>
    <radialGradient id="wheel" cx="0.42" cy="0.34" r="0.85">
      <stop offset="0" stop-color="#5a4526"/>
      <stop offset="0.55" stop-color="#3c2c17"/>
      <stop offset="1" stop-color="#251a0e"/>
    </radialGradient>
    <radialGradient id="hub" cx="0.4" cy="0.34" r="0.8">
      <stop offset="0" stop-color="#7a5c30"/>
      <stop offset="1" stop-color="#3a2a15"/>
    </radialGradient>
    <radialGradient id="ballgold" cx="0.38" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#fff3d2"/>
      <stop offset="0.5" stop-color="#f0c266"/>
      <stop offset="1" stop-color="#b8862f"/>
    </radialGradient>
    <radialGradient id="seatglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe6a8" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#f2c66a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f2c66a" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#c98b58"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- faint scattered warm motes -->
  <g fill="#e9c67e">
    <circle cx="150" cy="110" r="1.4" opacity="0.30"/>
    <circle cx="1060" cy="140" r="1.5" opacity="0.32"/>
    <circle cx="980" cy="520" r="1.3" opacity="0.26"/>
    <circle cx="230" cy="520" r="1.5" opacity="0.30"/>
    <circle cx="640" cy="58" r="1.2" opacity="0.22"/>
    <circle cx="1120" cy="340" r="1.3" opacity="0.24"/>
    <circle cx="90" cy="330" r="1.2" opacity="0.22"/>
  </g>

  <!-- seat glow behind the held top notch -->
  <circle cx="600" cy="165" r="90" fill="url(#seatglow)"/>

  <!-- the detent wheel, centered at 600,315, radius 150 -->
  <g>
    <circle cx="600" cy="315" r="150" fill="url(#wheel)"/>
    <circle cx="600" cy="315" r="150" fill="none" stroke="#8a6c3d" stroke-width="2.5" opacity="0.7"/>
    <circle cx="600" cy="315" r="128" fill="none" stroke="#6b5637" stroke-width="1" opacity="0.4"/>

    <!-- ring of rounded notches carved into the rim; 12 positions, 30 deg apart -->
    <g fill="#150e07">
      <g transform="translate(600,315)">
        <g transform="rotate(0)"><rect x="-9" y="-160" width="18" height="26" rx="9"/></g>
        <g transform="rotate(30)"><rect x="-9" y="-160" width="18" height="26" rx="9"/></g>
        <g transform="rotate(60)"><rect x="-9" y="-160" width="18" height="26" rx="9"/></g>
        <g transform="rotate(90)"><rect x="-9" y="-160" width="18" height="26" rx="9"/></g>
        <g transform="rotate(120)"><rect x="-9" y="-160" width="18" height="26" rx="9"/></g>
        <g transform="rotate(150)"><rect x="-9" y="-160" width="18" height="26" rx="9"/></g>
        <g transform="rotate(180)"><rect x="-9" y="-160" width="18" height="26" rx="9"/></g>
        <g transform="rotate(210)"><rect x="-9" y="-160" width="18" height="26" rx="9"/></g>
        <g transform="rotate(240)"><rect x="-9" y="-160" width="18" height="26" rx="9"/></g>
        <g transform="rotate(270)"><rect x="-9" y="-160" width="18" height="26" rx="9"/></g>
        <g transform="rotate(300)"><rect x="-9" y="-160" width="18" height="26" rx="9"/></g>
        <g transform="rotate(330)"><rect x="-9" y="-160" width="18" height="26" rx="9"/></g>
      </g>
    </g>

    <!-- hub -->
    <circle cx="600" cy="315" r="30" fill="url(#hub)"/>
    <circle cx="600" cy="315" r="30" fill="none" stroke="#3a2a15" stroke-width="1.5"/>
    <circle cx="600" cy="315" r="7" fill="#1c130a"/>

    <!-- rotation possibility: faint curved arrow around lower-right rim -->
    <path d="M770,380 A175,175 0 0 1 640,483" fill="none" stroke="#c98b58" stroke-width="2.6"
          opacity="0.55" marker-end="url(#arrow)"/>
  </g>

  <!-- the spring pressing down from above into the top notch -->
  <!-- anchor plate -->
  <rect x="560" y="58" width="80" height="12" rx="4" fill="#6b5637" opacity="0.85"/>
  <!-- coil spring as a zigzag -->
  <path d="M600,70
           L582,84 L618,98 L582,112 L618,126 L600,140"
        fill="none" stroke="#b89a63" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" opacity="0.9"/>

  <!-- the seated follower ball, dropped into the top notch -->
  <circle cx="600" cy="152" r="19" fill="url(#ballgold)"/>
  <circle cx="600" cy="152" r="19" fill="none" stroke="#8a5f22" stroke-width="1" opacity="0.5"/>

  <!-- title, quiet, lower-left -->
  <text x="80" y="560" font-family="Georgia, 'Times New Roman', serif" font-size="34"
        fill="#e9c67e" opacity="0.82" letter-spacing="2">the detent</text>
  <text x="80" y="592" font-family="Georgia, 'Times New Roman', serif" font-size="17"
        fill="#9a8763" opacity="0.7" letter-spacing="1">the click that holds</text>
</svg>
