<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="The Rebar — a cutaway side view of a reinforced concrete beam spanning between two supports. A heavy load presses down on the top, where the concrete is squeezed in compression, shown in cool grey. Along the bottom of the span, where the beam is pulled in tension, run the horizontal steel reinforcing bars, ribbed and glowing warm amber, laced with upright stirrup loops. The steel is buried inside the stone, invisible from the surface but placed exactly where the pulling is. Faint hairline cracks climb up from the underside — the tearing the concrete would suffer if the rebar were not there — fading out where the steel holds it closed.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10141b"/>
      <stop offset="1" stop-color="#171c26"/>
    </linearGradient>
    <linearGradient id="concrete" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b95a1"/>
      <stop offset="0.42" stop-color="#6f7883"/>
      <stop offset="0.62" stop-color="#5b636e"/>
      <stop offset="1" stop-color="#454c56"/>
    </linearGradient>
    <linearGradient id="pier" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#565d68"/>
      <stop offset="1" stop-color="#363c45"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcf87"/>
      <stop offset="0.5" stop-color="#e0913f"/>
      <stop offset="1" stop-color="#8f521f"/>
    </linearGradient>
    <radialGradient id="tensionGlow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#ffab52" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffab52" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="load" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9d2dd" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#c9d2dd" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="1200" height="630" fill="url(#sky)"/>

  <!-- downward load arrows pressing on the top (compression) -->
  <g stroke="url(#load)" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M250 60 v90 m-16 -20 l16 20 l16 -20"/>
    <path d="M400 45 v105 m-16 -20 l16 20 l16 -20"/>
    <path d="M550 38 v112 m-16 -20 l16 20 l16 -20"/>
    <path d="M650 38 v112 m-16 -20 l16 20 l16 -20"/>
    <path d="M800 45 v105 m-16 -20 l16 20 l16 -20"/>
    <path d="M950 60 v90 m-16 -20 l16 20 l16 -20"/>
  </g>

  <!-- supporting piers -->
  <rect x="70" y="430" width="120" height="200" fill="url(#pier)"/>
  <rect x="1010" y="430" width="120" height="200" fill="url(#pier)"/>

  <!-- the concrete beam, slightly sagged along the underside -->
  <path d="M70 175
           L1130 175
           L1130 425
           Q600 470 70 425 Z" fill="url(#concrete)"/>

  <!-- warm glow along the tension zone at the bottom -->
  <ellipse cx="600" cy="430" rx="520" ry="120" fill="url(#tensionGlow)"/>

  <!-- faint label band: compression (top) implied by cool tone; texture flecks -->
  <g fill="#ffffff" fill-opacity="0.05">
    <circle cx="230" cy="240" r="4"/><circle cx="470" cy="215" r="3"/><circle cx="720" cy="250" r="5"/>
    <circle cx="880" cy="220" r="3"/><circle cx="360" cy="280" r="3"/><circle cx="980" cy="260" r="4"/>
    <circle cx="600" cy="225" r="3"/><circle cx="150" cy="260" r="3"/>
  </g>

  <!-- hairline cracks the concrete would tear if unreinforced: climbing from the underside -->
  <g stroke="#0c0f14" stroke-opacity="0.55" stroke-width="2.4" fill="none" stroke-linecap="round">
    <path d="M330 452 L338 405 L332 372 L340 345"/>
    <path d="M600 465 L594 415 L602 380 L596 350 L604 325"/>
    <path d="M780 458 L788 410 L782 378 L790 352"/>
    <path d="M470 458 L462 418 L470 388"/>
    <path d="M905 450 L898 415 L906 388"/>
  </g>

  <!-- STIRRUPS: upright loops wrapping the bottom bars -->
  <g fill="none" stroke="url(#steel)" stroke-width="7" stroke-linejoin="round" stroke-opacity="0.92">
    <rect x="250" y="360" width="34" height="72" rx="10"/>
    <rect x="410" y="368" width="34" height="72" rx="10"/>
    <rect x="570" y="372" width="34" height="72" rx="10"/>
    <rect x="730" y="368" width="34" height="72" rx="10"/>
    <rect x="890" y="360" width="34" height="72" rx="10"/>
  </g>

  <!-- MAIN reinforcing bars, ribbed (deformed), running the tension zone along the bottom -->
  <g stroke="url(#steel)" stroke-width="13" stroke-linecap="round" fill="none">
    <path d="M150 402 Q600 442 1050 402"/>
    <path d="M150 424 Q600 466 1050 424"/>
  </g>
  <!-- bar highlights -->
  <g stroke="#ffe6bc" stroke-width="3" stroke-opacity="0.75" stroke-linecap="round" fill="none">
    <path d="M170 397 Q600 437 1030 397"/>
    <path d="M170 419 Q600 461 1030 419"/>
  </g>

  <!-- deformation ribs across the bars (the lugs that let the stone grip the steel) -->
  <g stroke="#5a3216" stroke-width="2.2" stroke-opacity="0.85" stroke-linecap="round">
    <path d="M210 396 l10 12 M250 397 l10 12 M290 399 l10 12 M330 401 l10 12 M370 403 l10 12 M410 405 l10 12 M450 406 l10 12 M490 408 l10 12 M530 409 l10 12 M570 410 l10 12 M610 410 l10 12 M650 409 l10 12 M690 408 l10 12 M730 406 l10 12 M770 405 l10 12 M810 403 l10 12 M850 401 l10 12 M890 399 l10 12 M930 397 l10 12 M970 396 l10 12"/>
  </g>

  <!-- thin surface line of the beam over the steel: the monolithic face that hides it -->
  <path d="M70 175 L1130 175" stroke="#aab3bf" stroke-width="2" stroke-opacity="0.5"/>
  <path d="M70 425 Q600 470 1130 425" stroke="#2c313a" stroke-width="2.5" stroke-opacity="0.6" fill="none"/>
</svg>
