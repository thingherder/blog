<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>The Lockout Tag: a gray industrial disconnect switch on a dark steel wall, its handle pulled down to OFF. A red padlock hangs through the handle's hasp, and from the lock's shackle a red-and-white danger tag dangles on a wire tie. The tag reads "DANGER — DO NOT OPERATE" and has a blank "Name" line and a blank "Reason" line. Beside it, a second cream tag has been tied on, with a handwritten line reading "why (guessed, dated)". Title at lower left reads "The Lockout Tag" with the subtitle "a name on the lock, a reason on the tag".</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a3138"/><stop offset="1" stop-color="#161b20"/></linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a939b"/><stop offset="0.5" stop-color="#aab3ba"/><stop offset="1" stop-color="#7a838b"/></linearGradient>
    <linearGradient id="lock" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a3201c"/><stop offset="0.5" stop-color="#d23a2f"/><stop offset="1" stop-color="#8f1b18"/></linearGradient>
    <radialGradient id="glow" cx="0.55" cy="0.35" r="0.6"><stop offset="0" stop-color="#ffffff" stop-opacity="0.08"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#wall)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- wall seams and rivets -->
  <g stroke="#0e1216" stroke-width="3">
    <line x1="0" y1="160" x2="1200" y2="160"/><line x1="0" y1="470" x2="1200" y2="470"/>
    <line x1="300" y1="0" x2="300" y2="630"/><line x1="900" y1="0" x2="900" y2="630"/>
  </g>
  <g fill="#3a434b">
    <circle cx="320" cy="180" r="4"/><circle cx="880" cy="180" r="4"/><circle cx="320" cy="450" r="4"/><circle cx="880" cy="450" r="4"/>
  </g>
  <!-- conduit -->
  <rect x="582" y="0" width="36" height="92" fill="#5d666e"/>
  <rect x="574" y="80" width="52" height="14" rx="3" fill="#6c757d"/>
  <!-- disconnect box -->
  <rect x="470" y="92" width="260" height="330" rx="10" fill="url(#box)" stroke="#4b535a" stroke-width="4"/>
  <rect x="492" y="114" width="216" height="80" rx="4" fill="#6d767e"/>
  <text x="600" y="150" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#e9ecef">DISCONNECT</text>
  <text x="600" y="178" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#d0d5da">480 V · 3 PHASE</text>
  <!-- ON/OFF labels -->
  <text x="756" y="230" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#9aa3aa">ON</text>
  <text x="756" y="372" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#e9ecef">OFF</text>
  <!-- handle pivot and handle (down = OFF) -->
  <rect x="728" y="196" width="22" height="190" rx="6" fill="#4b535a"/>
  <circle cx="739" cy="230" r="14" fill="#30373d"/>
  <rect x="731" y="230" width="16" height="140" rx="6" fill="#1f2429"/>
  <rect x="722" y="352" width="34" height="34" rx="6" fill="#d9a321" stroke="#7a5a0e" stroke-width="2"/>
  <!-- hasp -->
  <rect x="734" y="386" width="10" height="34" fill="#3b4248"/>
  <circle cx="739" cy="414" r="6" fill="#161b20"/>
  <!-- padlock -->
  <path d="M722 448 v-28 a17 17 0 0 1 34 0 v28" fill="none" stroke="#c9ced3" stroke-width="7"/>
  <rect x="708" y="446" width="62" height="64" rx="8" fill="url(#lock)" stroke="#5e110f" stroke-width="2"/>
  <circle cx="739" cy="472" r="6" fill="#3a0a09"/><rect x="736" y="474" width="6" height="16" fill="#3a0a09"/>
  <!-- wire to danger tag -->
  <path d="M754 452 C 800 470, 812 500, 820 520" fill="none" stroke="#c9ced3" stroke-width="2.5"/>
  <!-- danger tag -->
  <g transform="rotate(-6 880 560)">
    <rect x="800" y="512" width="170" height="250" rx="10" fill="#f4f1ea" stroke="#5e110f" stroke-width="2"/>
    <circle cx="885" cy="532" r="8" fill="#2a3138" stroke="#c9ced3" stroke-width="2"/>
    <rect x="800" y="550" width="170" height="44" fill="#b8231e"/>
    <text x="885" y="581" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">DANGER</text>
    <text x="885" y="618" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#111">DO NOT</text>
  </g>
  <!-- second tag, the guessed why -->
  <path d="M700 452 C 660 470, 640 492, 632 512" fill="none" stroke="#c9ced3" stroke-width="2.5"/>
  <g transform="rotate(7 600 560)">
    <rect x="548" y="508" width="150" height="190" rx="10" fill="#efe3c4" stroke="#7a6a45" stroke-width="2"/>
    <circle cx="623" cy="528" r="8" fill="#2a3138" stroke="#c9ced3" stroke-width="2"/>
    <text x="623" y="566" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="19" fill="#3d3424">why</text>
    <text x="623" y="590" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#3d3424">(guessed,</text>
    <text x="623" y="610" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#3d3424">dated)</text>
  </g>
  <!-- title -->
  <text x="60" y="545" font-family="Georgia, 'Times New Roman', serif" font-size="58" fill="#f4f1ea">The Lockout Tag</text>
  <text x="62" y="585" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="24" fill="#c9ced3">a name on the lock, a reason on the tag</text>
</svg>
