<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2420"/>
      <stop offset="1" stop-color="#17120f"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4ecdc"/>
      <stop offset="1" stop-color="#e6dac2"/>
    </linearGradient>
    <filter id="soft" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- the delivery pile, seen edge-on at left -->
  <g transform="translate(90,150)">
    <rect x="0" y="300" width="300" height="10" fill="#d9ccb2"/>
    <rect x="0" y="288" width="300" height="10" fill="#e3d7bf"/>
    <rect x="0" y="276" width="300" height="10" fill="#d9ccb2"/>
    <rect x="0" y="264" width="300" height="10" fill="#e3d7bf"/>
    <!-- slip sheets: thin grey between -->
    <rect x="-8" y="298" width="316" height="2" fill="#8a7f72"/>
    <rect x="-8" y="286" width="316" height="2" fill="#8a7f72"/>
    <rect x="-8" y="274" width="316" height="2" fill="#8a7f72"/>
    <rect x="-8" y="262" width="316" height="2" fill="#8a7f72"/>
    <!-- powder specks -->
    <g fill="#f8f3e8" opacity="0.55">
      <circle cx="40" cy="240" r="1.6"/><circle cx="95" cy="225" r="1.2"/><circle cx="150" cy="248" r="1.5"/>
      <circle cx="210" cy="230" r="1.1"/><circle cx="260" cy="244" r="1.4"/><circle cx="120" cy="205" r="1"/>
      <circle cx="70" cy="212" r="1.3"/><circle cx="235" cy="208" r="1"/><circle cx="185" cy="196" r="1.2"/>
    </g>
  </g>

  <!-- printed sheet (wet face), bottom -->
  <g transform="translate(470,250) rotate(-3)">
    <rect width="300" height="320" fill="url(#paper)" stroke="#bfae8d" stroke-width="1"/>
    <text x="30" y="70" font-family="Georgia, serif" font-size="40" fill="#1d1a17">THE</text>
    <text x="30" y="118" font-family="Georgia, serif" font-size="40" fill="#1d1a17">STACKING</text>
    <g fill="#1d1a17" opacity="0.85">
      <rect x="30" y="148" width="240" height="6"/><rect x="30" y="166" width="220" height="6"/>
      <rect x="30" y="184" width="236" height="6"/><rect x="30" y="202" width="180" height="6"/>
      <rect x="30" y="230" width="240" height="6"/><rect x="30" y="248" width="210" height="6"/>
      <rect x="30" y="266" width="228" height="6"/>
    </g>
    <!-- wet sheen -->
    <rect x="22" y="36" width="260" height="250" fill="#ffffff" opacity="0.06"/>
  </g>

  <!-- the sheet above, lifted and flipped to show its back: mirrored ghost -->
  <g transform="translate(820,90) rotate(4)">
    <rect width="300" height="320" fill="url(#paper)" stroke="#bfae8d" stroke-width="1"/>
    <!-- clean ruled lines: the notes page -->
    <g stroke="#b9c7d6" stroke-width="1">
      <line x1="20" y1="60" x2="280" y2="60"/><line x1="20" y1="90" x2="280" y2="90"/>
      <line x1="20" y1="120" x2="280" y2="120"/><line x1="20" y1="150" x2="280" y2="150"/>
      <line x1="20" y1="180" x2="280" y2="180"/><line x1="20" y1="210" x2="280" y2="210"/>
      <line x1="20" y1="240" x2="280" y2="240"/><line x1="20" y1="270" x2="280" y2="270"/>
    </g>
    <!-- mirrored set-off ghost -->
    <g transform="translate(300,0) scale(-1,1)" opacity="0.28" filter="url(#soft)">
      <text x="30" y="70" font-family="Georgia, serif" font-size="40" fill="#3a332c">THE</text>
      <text x="30" y="118" font-family="Georgia, serif" font-size="40" fill="#3a332c">STACKING</text>
      <g fill="#3a332c">
        <rect x="30" y="148" width="240" height="6"/><rect x="30" y="166" width="220" height="6"/>
        <rect x="30" y="184" width="236" height="6"/><rect x="30" y="202" width="180" height="6"/>
        <rect x="30" y="230" width="240" height="6"/>
      </g>
    </g>
  </g>

  <!-- arrow of transfer -->
  <path d="M 760 300 C 800 260, 820 240, 850 220" fill="none" stroke="#c9563c" stroke-width="2.5" stroke-dasharray="6 6"/>
  <path d="M 850 220 l -14 2 l 6 10 z" fill="#c9563c"/>

  <!-- title -->
  <text x="90" y="100" font-family="Georgia, serif" font-size="58" fill="#f4ecdc" letter-spacing="2">The Set-Off</text>
  <text x="92" y="136" font-family="Georgia, serif" font-style="italic" font-size="20" fill="#bfae8d">wet ink marks whatever you stack on it</text>
  <text x="90" y="560" font-family="Courier New, monospace" font-size="14" fill="#8a7f72">slip sheet · spray powder · tissue guard</text>
</svg>
