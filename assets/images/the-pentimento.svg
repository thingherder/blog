<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="The Pentimento — a dark oil-painted surface in deep umbers and warm browns, its varnish crackled with age. Across the middle a portrait figure is rendered in the final, upper layer: a shrouded shoulder and a raised hand held up near the chest. Beneath and slightly offset, a ghost of an earlier decision swims up through the thinning paint — a second, lower arm and a faint buried face, drawn in pale translucent ochre as if the oil has cleared with the decades to reveal what the painter once covered. Fine craquelure lines web the whole surface, and a soft warm light falls from the upper left as in a gallery.">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2018"/>
      <stop offset="0.5" stop-color="#1a130d"/>
      <stop offset="1" stop-color="#0e0906"/>
    </linearGradient>
    <radialGradient id="gallerylight" cx="0.34" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#e8c98a" stop-opacity="0.30"/>
      <stop offset="0.4" stop-color="#b9945a" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="drapery" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a2f1c"/>
      <stop offset="0.5" stop-color="#2e1c10"/>
      <stop offset="1" stop-color="#150c07"/>
    </linearGradient>
    <linearGradient id="flesh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c99b66"/>
      <stop offset="1" stop-color="#7c5535"/>
    </linearGradient>
    <radialGradient id="ghost" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#e6d3a4" stop-opacity="0.42"/>
      <stop offset="0.6" stop-color="#c7a86e" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#c7a86e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- aged oil ground -->
  <rect x="0" y="0" width="1200" height="630" fill="url(#ground)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#gallerylight)"/>

  <!-- ================= THE BURIED EARLIER DECISION (pentimento) ================= -->
  <!-- painted first, covered over, now swimming back up through the thinning oil -->
  <g opacity="0.9">
    <!-- soft halo of cleared varnish where the ghost surfaces -->
    <ellipse cx="640" cy="360" rx="240" ry="230" fill="url(#ghost)"/>
    <!-- the lower arm the painter first raised, then lowered and covered -->
    <path d="M470 470 Q560 430 660 470 Q720 498 770 560"
          fill="none" stroke="#dcc38a" stroke-opacity="0.34" stroke-width="30" stroke-linecap="round"/>
    <!-- ghost hand at the end of the buried arm -->
    <ellipse cx="778" cy="566" rx="26" ry="20" fill="#dcc38a" fill-opacity="0.30"/>
    <!-- the faint buried face, offset from the final one -->
    <g fill="none" stroke="#e8d4a2" stroke-opacity="0.30" stroke-width="5" stroke-linecap="round">
      <ellipse cx="600" cy="300" rx="62" ry="80" stroke-opacity="0.22"/>
      <path d="M576 288 Q586 282 596 288"/>
      <path d="M612 288 Q622 282 632 288"/>
      <path d="M604 300 L604 322"/>
      <path d="M586 342 Q604 352 622 342"/>
    </g>
  </g>

  <!-- ================= THE FINAL UPPER LAYER (what the painter chose) ================= -->
  <!-- shrouded shoulder and drapery -->
  <path d="M300 630 L300 540 Q360 430 520 420 Q690 412 760 470 Q840 540 860 630 Z" fill="url(#drapery)"/>
  <!-- the raised hand of the final decision, held near the chest -->
  <path d="M560 560 Q620 470 700 430 Q740 412 772 430 Q760 470 726 500 Q690 532 700 560"
        fill="url(#flesh)"/>
  <!-- fingers -->
  <g fill="none" stroke="#3a2414" stroke-width="4" stroke-linecap="round" opacity="0.55">
    <path d="M712 452 Q734 436 758 434"/>
    <path d="M708 470 Q732 456 760 456"/>
    <path d="M708 488 Q730 478 754 480"/>
  </g>
  <!-- final face, in the upper layer, warm and solid -->
  <ellipse cx="660" cy="286" rx="60" ry="78" fill="url(#flesh)"/>
  <path d="M660 208 Q596 214 592 300 Q640 250 660 250 Q680 250 728 300 Q724 214 660 208 Z" fill="#241610"/>
  <g fill="none" stroke="#2c1a10" stroke-width="4" stroke-linecap="round" opacity="0.7">
    <path d="M636 276 Q648 270 660 276"/>
    <path d="M676 276 Q688 270 700 276"/>
    <path d="M668 292 L666 312"/>
    <path d="M646 330 Q668 342 690 330"/>
  </g>

  <!-- ================= CRAQUELURE — the web of age cracks over everything ================= -->
  <g stroke="#0a0604" stroke-opacity="0.28" stroke-width="1.1" fill="none">
    <path d="M0 90 Q220 120 360 96 Q560 66 780 104 Q980 138 1200 108"/>
    <path d="M0 210 Q180 240 340 214 Q580 178 820 226 Q1010 262 1200 232"/>
    <path d="M0 360 Q200 392 380 362 Q600 326 840 378 Q1020 414 1200 384"/>
    <path d="M0 500 Q220 532 400 502 Q620 466 860 518 Q1050 552 1200 522"/>
    <path d="M120 0 Q150 160 126 320 Q100 470 138 630"/>
    <path d="M330 0 Q360 150 336 300 Q312 460 348 630"/>
    <path d="M560 0 Q590 160 566 300 Q542 470 580 630"/>
    <path d="M800 0 Q828 150 806 320 Q784 470 820 630"/>
    <path d="M1010 0 Q1040 160 1016 300 Q992 470 1030 630"/>
  </g>

  <!-- faint gallery vignette -->
  <rect x="0" y="0" width="1200" height="630" fill="none"/>
  <path d="M0 0 H1200 V630 H0 Z" fill="none" stroke="#000" stroke-opacity="0.0"/>
  <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75">
    <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000000" stop-opacity="0.45"/>
  </radialGradient>
  <rect x="0" y="0" width="1200" height="630" fill="url(#vig)"/>
</svg>
