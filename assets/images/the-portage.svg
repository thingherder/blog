<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="The Portage — two stretches of water separated by a rise of land under a pale northern sky. In the lower left a calm river reaches up to a shoreline; in the upper right, beyond a wooded height of land, a second body of water flows away toward a different horizon. A worn trail, pressed pale and low into the dark ground, climbs from the near water over the divide toward the far water. A small solitary figure walks the trail carrying an overturned canoe on its shoulders. Faint cairn stones mark the way. Cool light on the water, warm light along the crest of the carry.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3cdd2"/>
      <stop offset="0.55" stop-color="#d6dcda"/>
      <stop offset="1" stop-color="#e2e2d6"/>
    </linearGradient>
    <linearGradient id="farwater" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8ba3ad"/>
      <stop offset="1" stop-color="#a8bcc0"/>
    </linearGradient>
    <linearGradient id="nearwater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7f99a4"/>
      <stop offset="1" stop-color="#5c7480"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d6a52"/>
      <stop offset="1" stop-color="#403f30"/>
    </linearGradient>
    <linearGradient id="crest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a8560"/>
      <stop offset="1" stop-color="#605c43"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ccc3a5"/>
      <stop offset="1" stop-color="#a79d7d"/>
    </linearGradient>
    <linearGradient id="forest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f4d3c"/>
      <stop offset="1" stop-color="#2b3529"/>
    </linearGradient>
    <radialGradient id="warmlight" cx="0.56" cy="0.34" r="0.6">
      <stop offset="0" stop-color="#ffe6ac" stop-opacity="0.42"/>
      <stop offset="0.6" stop-color="#f3ce86" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#f3ce86" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="1200" height="630" fill="url(#sky)"/>

  <!-- far horizon and the second watershed, running away to a different sea -->
  <path d="M600 232 L720 214 L840 236 L960 210 L1080 238 L1200 220 L1200 300 L600 300 Z" fill="#9aa7ab" opacity="0.7"/>
  <path d="M600 300 Q 780 280, 960 296 T 1200 292 L1200 372 L600 372 Z" fill="url(#farwater)"/>
  <!-- far water glints -->
  <g stroke="#dfe8e7" stroke-width="2" opacity="0.5">
    <line x1="700" y1="322" x2="770" y2="322"/>
    <line x1="880" y1="338" x2="960" y2="338"/>
    <line x1="1040" y1="326" x2="1110" y2="326"/>
  </g>

  <!-- wooded height of land: the divide between the two waters -->
  <path d="M420 372 Q 660 300, 900 356 Q 1050 388, 1200 360 L1200 470 L420 470 Z" fill="url(#crest)"/>
  <!-- a scatter of conifers along the ridge -->
  <g fill="url(#forest)">
    <path d="M520 356 l14 34 -28 0 Z"/>
    <path d="M560 348 l16 40 -32 0 Z"/>
    <path d="M612 340 l15 38 -30 0 Z"/>
    <path d="M672 336 l17 42 -34 0 Z"/>
    <path d="M742 340 l15 38 -30 0 Z"/>
    <path d="M812 350 l16 40 -32 0 Z"/>
    <path d="M884 360 l14 34 -28 0 Z"/>
    <path d="M958 366 l13 32 -26 0 Z"/>
  </g>

  <!-- the near land / dark ground of the carry -->
  <path d="M0 400 Q 300 350, 620 402 Q 900 446, 1200 430 L1200 630 L0 630 Z" fill="url(#land)"/>

  <!-- near water: the stretch you paddled in on -->
  <path d="M0 470 Q 130 452, 250 476 Q 330 492, 300 540 Q 250 600, 120 610 L0 620 Z" fill="url(#nearwater)"/>
  <g stroke="#c3d2d4" stroke-width="2" opacity="0.45">
    <line x1="60" y1="512" x2="150" y2="512"/>
    <line x1="40" y1="548" x2="120" y2="548"/>
    <line x1="80" y1="580" x2="160" y2="580"/>
  </g>

  <!-- the portage trail: worn pale and low, climbing from near water over the divide toward the far -->
  <path d="M250 520
           C 360 500, 400 470, 470 452
           C 560 430, 640 396, 720 372
           C 780 354, 830 340, 880 340"
        fill="none" stroke="url(#trail)" stroke-width="26" stroke-linecap="round" opacity="0.9"/>
  <path d="M250 520
           C 360 500, 400 470, 470 452
           C 560 430, 640 396, 720 372
           C 780 354, 830 340, 880 340"
        fill="none" stroke="#e6ddbf" stroke-width="6" stroke-linecap="round" opacity="0.5"/>

  <!-- cairn stones marking the way, left by those who carried before -->
  <g fill="#8f876c" opacity="0.9">
    <g transform="translate(392 486)">
      <ellipse cx="0" cy="6" rx="10" ry="5"/>
      <ellipse cx="0" cy="-2" rx="7" ry="4"/>
      <ellipse cx="0" cy="-8" rx="4" ry="3"/>
    </g>
    <g transform="translate(596 420)">
      <ellipse cx="0" cy="5" rx="8" ry="4"/>
      <ellipse cx="0" cy="-1" rx="6" ry="3"/>
      <ellipse cx="0" cy="-6" rx="3" ry="2.5"/>
    </g>
    <g transform="translate(790 366)">
      <ellipse cx="0" cy="4" rx="7" ry="3.5"/>
      <ellipse cx="0" cy="-2" rx="5" ry="3"/>
      <ellipse cx="0" cy="-6" rx="3" ry="2"/>
    </g>
  </g>

  <!-- the walker, carrying the overturned canoe across the carry -->
  <g transform="translate(470 452)">
    <!-- overturned canoe on the shoulders -->
    <path d="M-52 -34 Q 0 -50, 52 -34 Q 12 -26, 0 -25 Q -12 -26, -52 -34 Z" fill="#3a3026"/>
    <path d="M-52 -34 Q 0 -50, 52 -34" fill="none" stroke="#5a4c3b" stroke-width="2.5"/>
    <!-- figure beneath -->
    <rect x="-5" y="-28" width="10" height="30" rx="4" fill="#2c2c2e"/>
    <line x1="-6" y1="-16" x2="-14" y2="-30" stroke="#2c2c2e" stroke-width="4" stroke-linecap="round"/>
    <line x1="6" y1="-16" x2="14" y2="-30" stroke="#2c2c2e" stroke-width="4" stroke-linecap="round"/>
    <line x1="-3" y1="2" x2="-8" y2="22" stroke="#2c2c2e" stroke-width="5" stroke-linecap="round"/>
    <line x1="3" y1="2" x2="9" y2="22" stroke="#2c2c2e" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- warm light along the crest of the carry -->
  <rect x="0" y="0" width="1200" height="630" fill="url(#warmlight)"/>
</svg>
