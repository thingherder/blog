<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="A warm dark field holding a small three-by-three fragment of a chessboard, its squares in muted amber and shadow. At the center square stands a single glowing king. From the king, four thin arrows curve outward to the four squares around it, each of those squares faintly tinged with red to mark it as worse. Over the king's own square lies a ghosted dashed circle — the move that would keep the king where it is — drawn faint and unreachable, the forbidden pass. The center is safe; every place the king can go is worse; and the one place it wants to stay is not allowed.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#221a12"/>
      <stop offset="0.55" stop-color="#171008"/>
      <stop offset="1" stop-color="#0f0a05"/>
    </linearGradient>
    <radialGradient id="safeglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe6a8" stop-opacity="0.85"/>
      <stop offset="0.35" stop-color="#f2c66a" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#f2c66a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="kinggold" cx="0.4" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#fff3d2"/>
      <stop offset="0.55" stop-color="#f0c266"/>
      <stop offset="1" stop-color="#b8862f"/>
    </radialGradient>
    <radialGradient id="worse" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#8a2f24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8a2f24" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#c98b58"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- faint scattered warm motes -->
  <g fill="#e9c67e">
    <circle cx="150" cy="100" r="1.4" opacity="0.30"/>
    <circle cx="1060" cy="130" r="1.5" opacity="0.35"/>
    <circle cx="980" cy="520" r="1.3" opacity="0.28"/>
    <circle cx="220" cy="520" r="1.5" opacity="0.30"/>
    <circle cx="620" cy="60" r="1.2" opacity="0.22"/>
    <circle cx="1120" cy="330" r="1.3" opacity="0.25"/>
  </g>

  <!-- 3x3 board fragment centered at 600,315; each square 150px -->
  <!-- board group offset so center square spans 525..675 x, 240..390 y -->
  <g>
    <!-- worse-square red glows behind the four orthogonal neighbors -->
    <circle cx="600" cy="165" r="130" fill="url(#worse)"/>
    <circle cx="600" cy="465" r="130" fill="url(#worse)"/>
    <circle cx="450" cy="315" r="130" fill="url(#worse)"/>
    <circle cx="750" cy="315" r="130" fill="url(#worse)"/>

    <!-- squares: light and dark, muted -->
    <!-- row top (y 90..240) -->
    <rect x="450" y="90"  width="150" height="150" fill="#2c2113" opacity="0.9"/>
    <rect x="600" y="90"  width="150" height="150" fill="#3a2c19" opacity="0.9"/>
    <rect x="750" y="90"  width="150" height="150" fill="#2c2113" opacity="0.9"/>
    <!-- row mid (y 240..390) -->
    <rect x="450" y="240" width="150" height="150" fill="#3a2c19" opacity="0.9"/>
    <rect x="525" y="240" width="150" height="150" fill="#4a3720" opacity="0.95"/>
    <rect x="750" y="240" width="150" height="150" fill="#3a2c19" opacity="0.9"/>
    <!-- row bottom (y 390..540) -->
    <rect x="450" y="390" width="150" height="150" fill="#2c2113" opacity="0.9"/>
    <rect x="600" y="390" width="150" height="150" fill="#3a2c19" opacity="0.9"/>
    <rect x="750" y="390" width="150" height="150" fill="#2c2113" opacity="0.9"/>

    <!-- thin grid strokes -->
    <g stroke="#6b5637" stroke-width="1.2" opacity="0.5" fill="none">
      <rect x="450" y="90" width="450" height="450"/>
      <line x1="600" y1="90" x2="600" y2="540"/>
      <line x1="750" y1="90" x2="750" y2="540"/>
      <line x1="450" y1="240" x2="900" y2="240"/>
      <line x1="450" y1="390" x2="900" y2="390"/>
    </g>

    <!-- center safe glow -->
    <circle cx="600" cy="315" r="150" fill="url(#safeglow)"/>

    <!-- forbidden pass: ghosted dashed circle over the king's own square -->
    <circle cx="600" cy="315" r="86" fill="none" stroke="#9a8763" stroke-width="2.4"
            stroke-dasharray="7 11" opacity="0.5"/>

    <!-- arrows from king to the four orthogonal worse squares -->
    <g stroke="#c98b58" stroke-width="3" fill="none" opacity="0.85" marker-end="url(#arrow)">
      <path d="M600,250 C600,225 600,210 600,180"/>
      <path d="M600,380 C600,405 600,420 600,450"/>
      <path d="M535,315 C510,315 495,315 468,315"/>
      <path d="M665,315 C690,315 705,315 732,315"/>
    </g>

    <!-- the king, at center -->
    <g transform="translate(600,315)">
      <!-- crown cross -->
      <path d="M-4,-70 L4,-70 L4,-60 L14,-60 L14,-52 L4,-52 L4,-44 L-4,-44 L-4,-52 L-14,-52 L-14,-60 L-4,-60 Z"
            fill="url(#kinggold)"/>
      <!-- body -->
      <path d="M0,-44
               C 26,-40 34,-18 22,2
               C 34,10 34,30 24,42
               L -24,42
               C -34,30 -34,10 -22,2
               C -34,-18 -26,-40 0,-44 Z"
            fill="url(#kinggold)"/>
      <!-- base -->
      <rect x="-30" y="42" width="60" height="12" rx="4" fill="url(#kinggold)"/>
      <!-- subtle inner shading line -->
      <path d="M0,-40 C 18,-34 22,-16 12,0" fill="none" stroke="#8a5f22" stroke-width="1.6" opacity="0.5"/>
    </g>
  </g>

  <!-- title, quiet, lower-left -->
  <text x="80" y="560" font-family="Georgia, 'Times New Roman', serif" font-size="34"
        fill="#e9c67e" opacity="0.82" letter-spacing="2">the zugzwang</text>
  <text x="80" y="592" font-family="Georgia, 'Times New Roman', serif" font-size="17"
        fill="#9a8763" opacity="0.7" letter-spacing="1">compulsion to move</text>
</svg>
