<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
<title>The Test Button: a dim room seen in cross-section. In the upper-left corner where ceiling meets wall, a round white smoke alarm sits tucked into a shaded triangle labeled "dead air". A grey plume of smoke rises from the lower right, flattens along the ceiling, and rolls past the corner a few inches below the alarm without touching it. At right, a typed checklist reads: "horn — test button ✓", "sensor — canned smoke ✓", "reaches it — ?". Title at lower left reads "The Test Button" with the subtitle "the horn works. the sensor works. the smoke goes by."</title>
<defs>
<linearGradient id="room" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2d33"/><stop offset="1" stop-color="#16181c"/></linearGradient>
<linearGradient id="wall" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3a3e46"/><stop offset="1" stop-color="#2c3037"/></linearGradient>
<radialGradient id="disc" cx="0.42" cy="0.38" r="0.7"><stop offset="0" stop-color="#ffffff"/><stop offset="0.7" stop-color="#e3e4df"/><stop offset="1" stop-color="#a9aba5"/></radialGradient>
<radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ff4a3a" stop-opacity="0.9"/><stop offset="1" stop-color="#ff4a3a" stop-opacity="0"/></radialGradient>
<linearGradient id="smoke" x1="1" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#9aa0a8" stop-opacity="0.15"/><stop offset="0.5" stop-color="#b8bdc4" stop-opacity="0.55"/><stop offset="1" stop-color="#c9cdd2" stop-opacity="0.35"/></linearGradient>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#7fb6d9" stroke-opacity="0.35" stroke-width="2"/></pattern>
<linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3eedf"/><stop offset="1" stop-color="#e2dbc6"/></linearGradient>
<filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
<filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>

<!-- room -->
<rect width="1200" height="630" fill="url(#room)"/>
<!-- ceiling slab -->
<rect x="0" y="0" width="1200" height="70" fill="#4a4f58"/>
<rect x="0" y="66" width="1200" height="4" fill="#5d636d"/>
<!-- left wall -->
<rect x="0" y="70" width="70" height="560" fill="url(#wall)"/>
<rect x="66" y="70" width="4" height="560" fill="#5d636d"/>

<!-- dead air triangle -->
<path d="M70 70 L230 70 L70 230 Z" fill="url(#hatch)"/>
<path d="M230 70 L70 230" stroke="#7fb6d9" stroke-width="1.5" stroke-dasharray="6 6" fill="none" opacity="0.8"/>
<text x="150" y="200" font-family="Courier New, monospace" font-size="17" fill="#9fcbe6" transform="rotate(-45 150 200)">dead air</text>

<!-- smoke plume: rises from lower right, spreads along ceiling, rolls past corner -->
<g filter="url(#blur)">
  <path d="M640 640 C600 520 660 430 600 330 C560 250 610 170 560 110 C520 80 420 92 330 100 C260 106 210 120 175 160 C150 190 140 240 130 300 L190 300 C200 250 220 210 250 185 C290 150 380 140 470 140 C560 140 640 190 660 270 C690 380 700 500 740 640 Z" fill="url(#smoke)"/>
</g>
<g fill="#aeb3ba" fill-opacity="0.16" filter="url(#blur)"><circle cx="660" cy="560" r="55"/><circle cx="640" cy="470" r="50"/><circle cx="630" cy="380" r="48"/><circle cx="610" cy="290" r="46"/><circle cx="590" cy="200" r="44"/><circle cx="540" cy="135" r="42"/><circle cx="450" cy="125" r="44"/><circle cx="360" cy="128" r="42"/><circle cx="280" cy="145" r="38"/><circle cx="215" cy="190" r="34"/><circle cx="180" cy="250" r="30"/></g>
<g fill="none" stroke="#c9cdd2" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round" filter="url(#soft)">
  <path d="M660 600 C630 500 680 420 630 320 C595 245 640 175 590 125"/>
  <path d="M560 112 C480 98 380 104 300 118 C240 130 200 160 180 210"/>
  <path d="M520 130 C440 122 360 128 290 145 C240 158 215 190 205 240"/>
  <path d="M175 160 C160 180 152 210 150 250"/>
</g>
<!-- curl arrow showing smoke rolling past -->
<path d="M300 150 C250 165 215 195 200 250" fill="none" stroke="#e8c26a" stroke-width="2" stroke-dasharray="4 5" opacity="0.8"/>
<path d="M194 244 L200 258 L208 245" fill="none" stroke="#e8c26a" stroke-width="2" opacity="0.8"/>

<!-- smoke alarm tucked into the corner -->
<g transform="translate(128 70) scale(1.5)">
  <ellipse cx="0" cy="10" rx="40" ry="13" fill="#000" opacity="0.35"/>
  <path d="M-40 0 L40 0 L36 14 Q0 24 -36 14 Z" fill="url(#disc)" stroke="#8a8c86" stroke-width="1"/>
  <g stroke="#9a9c96" stroke-width="1.2">
    <line x1="-26" y1="6" x2="-26" y2="14"/><line x1="-18" y1="6" x2="-18" y2="16"/><line x1="-10" y1="6" x2="-10" y2="17"/>
    <line x1="10" y1="6" x2="10" y2="17"/><line x1="18" y1="6" x2="18" y2="16"/><line x1="26" y1="6" x2="26" y2="14"/>
  </g>
  <ellipse cx="0" cy="17" rx="7" ry="4" fill="#d8d9d4" stroke="#7d7f79"/>
  <circle cx="22" cy="12" r="10" fill="url(#glow)"/>
  <circle cx="22" cy="12" r="2.2" fill="#ff5a48"/>
</g>

<!-- checklist card -->
<g transform="translate(800 120) rotate(1.5)">
  <rect x="6" y="8" width="340" height="250" fill="#000" opacity="0.35"/>
  <rect x="0" y="0" width="340" height="250" fill="url(#paper)"/>
  <line x1="40" y1="0" x2="40" y2="250" stroke="#d9867a" stroke-width="1.2"/>
  <g stroke="#b9c7d6" stroke-width="1"><line x1="0" y1="70" x2="340" y2="70"/><line x1="0" y1="130" x2="340" y2="130"/><line x1="0" y1="190" x2="340" y2="190"/></g>
  <text x="56" y="44" font-family="Courier New, monospace" font-size="19" font-weight="bold" fill="#2b2b2b">FUNCTIONAL TEST</text>
  <text x="56" y="106" font-family="Courier New, monospace" font-size="18" fill="#2b2b2b">horn — test button</text>
  <text x="56" y="166" font-family="Courier New, monospace" font-size="18" fill="#2b2b2b">sensor — canned smoke</text>
  <text x="56" y="226" font-family="Courier New, monospace" font-size="18" fill="#2b2b2b">reaches it</text>
  <path d="M296 96 l8 9 l16 -20" fill="none" stroke="#2f7a3e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M296 156 l8 9 l16 -20" fill="none" stroke="#2f7a3e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="298" y="232" font-family="Georgia, serif" font-size="36" font-style="italic" fill="#b3352a">?</text>
</g>

<!-- title -->
<text x="70" y="545" font-family="Georgia, serif" font-size="64" fill="#f1ede2">The Test Button</text>
<text x="74" y="585" font-family="Georgia, serif" font-size="23" font-style="italic" fill="#b9bec6">the horn works. the sensor works. the smoke goes by.</text>
</svg>
