<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="On a dark blue-black field, a single classical column is drawn from base to capital in cool geometric lines, with faint vertical flutes running up the shaft. Two straight dashed guide lines, one on each side, mark where a perfectly, measurably straight column would stand. The stone edges of the shaft bow gently outside those guides about a third of the way up — the entasis, the slight swelling — and the belly between the guide and the stone glows a soft warm amber, the tension that makes the column read as upright and alive. A wide abacus and a flared echinus cap the top; a plinth and stylobate steps carry the base. The image shows a column that looks straight precisely because it is not.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0d15"/>
      <stop offset="0.6" stop-color="#111826"/>
      <stop offset="1" stop-color="#1b2333"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5f7791" stop-opacity="0.34"/>
      <stop offset="0.5" stop-color="#8fa6bd" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#5f7791" stop-opacity="0.34"/>
    </linearGradient>
    <linearGradient id="stone2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5f7791" stop-opacity="0.34"/>
      <stop offset="0.5" stop-color="#93aac1" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#5f7791" stop-opacity="0.34"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe3f2"/>
      <stop offset="1" stop-color="#adc2d6"/>
    </linearGradient>
    <radialGradient id="belly" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f0c079" stop-opacity="0.85"/>
      <stop offset="0.6" stop-color="#e2a154" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#e2a154" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#e7a862" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#e7a862" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#halo)"/>

  <!-- warm belly glow: the tension in the swelling -->
  <ellipse cx="600" cy="380" rx="150" ry="185" fill="url(#belly)"/>

  <!-- capital: echinus (flared) + abacus (slab) -->
  <rect x="516" y="108" width="168" height="24" fill="url(#stone2)" stroke="#6f8aa6" stroke-width="1.2"/>
  <path d="M542,150 L525,132 L675,132 L658,150 Z" fill="url(#stone2)" stroke="#6f8aa6" stroke-width="1.2"/>

  <!-- the shaft, with entasis: edges bow OUTSIDE the straight guides -->
  <path d="M542,150 C512,300 508,410 526,555 L674,555 C692,410 688,300 658,150 Z"
        fill="url(#stone2)" stroke="url(#edge)" stroke-width="2"/>

  <!-- flutes: faint vertical channels following the swell -->
  <g fill="none" stroke="#bcd0e2" stroke-width="1" opacity="0.34">
    <path d="M561.3,158 C541.3,300 538.7,410 550.7,548"/>
    <path d="M580.7,158 C570.7,300 569.3,410 575.3,548"/>
    <path d="M600,158 C600,300 600,410 600,548"/>
    <path d="M619.3,158 C629.3,300 630.7,410 624.7,548"/>
    <path d="M638.7,158 C658.7,300 661.3,410 649.3,548"/>
  </g>

  <!-- the ruler-straight guides: where a measurably straight column would stand -->
  <g stroke="#f4cd88" stroke-width="1.3" stroke-dasharray="7 7" opacity="0.62">
    <line x1="542" y1="150" x2="526" y2="555"/>
    <line x1="658" y1="150" x2="674" y2="555"/>
  </g>

  <!-- base: plinth + stylobate steps -->
  <rect x="504" y="555" width="192" height="26" fill="url(#stone2)" stroke="#6f8aa6" stroke-width="1.2"/>
  <rect x="470" y="581" width="260" height="20" fill="url(#stone)" stroke="#6f8aa6" stroke-width="1" opacity="0.9"/>
  <rect x="436" y="601" width="328" height="18" fill="url(#stone)" stroke="#6f8aa6" stroke-width="1" opacity="0.8"/>
</svg>
