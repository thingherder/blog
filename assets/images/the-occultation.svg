<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="A dark slate-blue night sky. On the right, a bright white star with a soft glow. Sliding in from the left toward it is a dark planet disk encircled by a thin, tilted ring. Scattered faint stars fill the field. Across the lower third runs a pale light curve — a horizontal line that holds bright, dips briefly twice on the approach where the ring crosses, drops to near-zero in a wide flat trough where the planet fully hides the star, then rises and dips twice more symmetrically as the ring clears. The winks in the curve, not the planet, carry the discovery.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1626"/>
      <stop offset="0.55" stop-color="#0a111e"/>
      <stop offset="1" stop-color="#070b14"/>
    </linearGradient>
    <radialGradient id="starGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.25" stop-color="#dbe7ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#dbe7ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#2b3648"/>
      <stop offset="0.6" stop-color="#151d2b"/>
      <stop offset="1" stop-color="#0b111b"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b7891" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#9fb0cc" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#6b7891" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#sky)"/>

  <!-- scattered faint stars -->
  <g fill="#cdd9f2">
    <circle cx="120" cy="80" r="1.6" opacity="0.7"/>
    <circle cx="250" cy="150" r="1.1" opacity="0.5"/>
    <circle cx="70" cy="240" r="1.3" opacity="0.6"/>
    <circle cx="330" cy="60" r="1.0" opacity="0.45"/>
    <circle cx="470" cy="120" r="1.4" opacity="0.6"/>
    <circle cx="640" cy="70" r="1.1" opacity="0.5"/>
    <circle cx="900" cy="60" r="1.5" opacity="0.65"/>
    <circle cx="1050" cy="130" r="1.2" opacity="0.55"/>
    <circle cx="1140" cy="250" r="1.3" opacity="0.6"/>
    <circle cx="180" cy="330" r="1.0" opacity="0.4"/>
    <circle cx="1010" cy="330" r="1.1" opacity="0.5"/>
    <circle cx="760" cy="140" r="1.0" opacity="0.45"/>
    <circle cx="560" cy="200" r="1.2" opacity="0.5"/>
  </g>

  <!-- the target star (right of center), bright point behind the drama -->
  <circle cx="820" cy="215" r="150" fill="url(#starGlow)"/>
  <circle cx="820" cy="215" r="8" fill="#ffffff"/>
  <g stroke="#ffffff" stroke-width="1.4" opacity="0.85">
    <line x1="820" y1="193" x2="820" y2="237"/>
    <line x1="798" y1="215" x2="842" y2="215"/>
  </g>

  <!-- the occulting planet, sliding in from the left toward the star -->
  <!-- back half of ring (behind disk) -->
  <g transform="translate(560,235) rotate(-24)">
    <path d="M -175 0 A 175 46 0 0 1 175 0" fill="none" stroke="url(#ring)" stroke-width="9"/>
  </g>
  <circle cx="560" cy="235" r="112" fill="url(#planet)"/>
  <!-- subtle terminator shading on the disk -->
  <path d="M 560 123 A 112 112 0 0 1 560 347 A 150 112 0 0 0 560 123 Z" fill="#060a12" opacity="0.5"/>
  <!-- front half of ring (over disk) -->
  <g transform="translate(560,235) rotate(-24)">
    <path d="M 175 0 A 175 46 0 0 1 -175 0" fill="none" stroke="url(#ring)" stroke-width="11"/>
  </g>

  <!-- motion arrow: planet moving toward the star -->
  <g stroke="#5f6f8c" stroke-width="2" opacity="0.55" fill="none">
    <line x1="690" y1="235" x2="735" y2="235"/>
    <path d="M 728 229 L 738 235 L 728 241"/>
  </g>

  <!-- ================= LIGHT CURVE ================= -->
  <!-- baseline grid -->
  <g stroke="#233047" stroke-width="1" opacity="0.6">
    <line x1="120" y1="470" x2="1080" y2="470"/>
    <line x1="120" y1="560" x2="1080" y2="560"/>
  </g>
  <text x="120" y="455" fill="#7d8ba6" font-family="Georgia, serif" font-size="18" font-style="italic">brightness of the star</text>
  <text x="1080" y="585" fill="#5f6f8c" font-family="Georgia, serif" font-size="15" text-anchor="end">time</text>

  <!-- the curve: bright, two winks (rings), deep flat trough (planet), two winks, bright -->
  <path d="M 120 470
           L 300 470
           L 322 470 L 336 512 L 350 470
           L 388 470 L 402 508 L 416 470
           L 470 470
           C 500 470 510 560 545 560
           L 655 560
           C 690 560 700 470 730 470
           L 784 470
           L 798 508 L 812 470
           L 850 470 L 864 512 L 878 470
           L 1080 470"
        fill="none" stroke="#ffe6a8" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- annotate the winks -->
  <g fill="#9fb0cc" font-family="Georgia, serif" font-size="15" font-style="italic" text-anchor="middle">
    <text x="369" y="540">rings</text>
    <text x="600" y="600">planet</text>
    <text x="831" y="540">rings</text>
  </g>
</svg>
