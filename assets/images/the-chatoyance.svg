<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="On a dark blue-black field, a large polished oval cabochon of tiger's-eye floats at center, drawn in warm amber and brown gradients. Across its dome run many fine parallel fibers as thin horizontal lines, densely packed. Perpendicular to the fibers, a single vertical bar of bright golden light stands suspended just below the stone's surface — the chatoyant band — glowing brightest at the center and fading toward the top and bottom, with a soft halo bleeding into the surrounding brown. The band sits slightly left of center, as if it has slid there as the stone was turned. The image shows a still stone throwing up a moving line of light: an eye that seems to watch, assembled entirely from stationary parallel threads.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0c12"/>
      <stop offset="0.6" stop-color="#12111a"/>
      <stop offset="1" stop-color="#1c1712"/>
    </linearGradient>
    <radialGradient id="stone" cx="0.42" cy="0.4" r="0.72">
      <stop offset="0" stop-color="#7a4d1f"/>
      <stop offset="0.5" stop-color="#5c3915"/>
      <stop offset="0.85" stop-color="#3c2510"/>
      <stop offset="1" stop-color="#2a1a0b"/>
    </radialGradient>
    <linearGradient id="fiber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9903f" stop-opacity="0.0"/>
      <stop offset="0.5" stop-color="#e8b866" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c9903f" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2c8" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#ffe9a8" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#fffbe8" stop-opacity="1"/>
      <stop offset="0.65" stop-color="#ffe9a8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff2c8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe6a0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffe6a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sheen" cx="0.36" cy="0.28" r="0.4">
      <stop offset="0" stop-color="#ffe3ad" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffe3ad" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambient" cx="0.5" cy="0.46" r="0.55">
      <stop offset="0" stop-color="#3a2c18" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#3a2c18" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cab">
      <ellipse cx="600" cy="315" rx="330" ry="205"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#ambient)"/>

  <!-- the cabochon body -->
  <ellipse cx="600" cy="315" rx="330" ry="205" fill="url(#stone)" stroke="#2a1a0b" stroke-width="3"/>

  <!-- parallel fibers running horizontally under the dome -->
  <g clip-path="url(#cab)">
    <g stroke="url(#fiber)" stroke-width="1.1">
      <line x1="270" y1="140" x2="930" y2="140"/>
      <line x1="270" y1="150" x2="930" y2="150"/>
      <line x1="270" y1="160" x2="930" y2="160"/>
      <line x1="270" y1="170" x2="930" y2="170"/>
      <line x1="270" y1="180" x2="930" y2="180"/>
      <line x1="270" y1="190" x2="930" y2="190"/>
      <line x1="270" y1="200" x2="930" y2="200"/>
      <line x1="270" y1="210" x2="930" y2="210"/>
      <line x1="270" y1="220" x2="930" y2="220"/>
      <line x1="270" y1="230" x2="930" y2="230"/>
      <line x1="270" y1="240" x2="930" y2="240"/>
      <line x1="270" y1="250" x2="930" y2="250"/>
      <line x1="270" y1="260" x2="930" y2="260"/>
      <line x1="270" y1="270" x2="930" y2="270"/>
      <line x1="270" y1="280" x2="930" y2="280"/>
      <line x1="270" y1="290" x2="930" y2="290"/>
      <line x1="270" y1="300" x2="930" y2="300"/>
      <line x1="270" y1="310" x2="930" y2="310"/>
      <line x1="270" y1="320" x2="930" y2="320"/>
      <line x1="270" y1="330" x2="930" y2="330"/>
      <line x1="270" y1="340" x2="930" y2="340"/>
      <line x1="270" y1="350" x2="930" y2="350"/>
      <line x1="270" y1="360" x2="930" y2="360"/>
      <line x1="270" y1="370" x2="930" y2="370"/>
      <line x1="270" y1="380" x2="930" y2="380"/>
      <line x1="270" y1="390" x2="930" y2="390"/>
      <line x1="270" y1="400" x2="930" y2="400"/>
      <line x1="270" y1="410" x2="930" y2="410"/>
      <line x1="270" y1="420" x2="930" y2="420"/>
      <line x1="270" y1="430" x2="930" y2="430"/>
      <line x1="270" y1="440" x2="930" y2="440"/>
      <line x1="270" y1="450" x2="930" y2="450"/>
      <line x1="270" y1="460" x2="930" y2="460"/>
      <line x1="270" y1="470" x2="930" y2="470"/>
      <line x1="270" y1="480" x2="930" y2="480"/>
      <line x1="270" y1="490" x2="930" y2="490"/>
    </g>

    <!-- the chatoyant band: a vertical bar of light, slid slightly left of center -->
    <ellipse cx="520" cy="315" rx="120" ry="215" fill="url(#glow)"/>
    <rect x="500" y="100" width="40" height="430" fill="url(#band)"/>
    <rect x="512" y="100" width="16" height="430" fill="#fffdf2" opacity="0.9"/>

    <!-- top-left sheen on the polished dome -->
    <ellipse cx="470" cy="230" rx="220" ry="150" fill="url(#sheen)"/>
  </g>

  <!-- crisp rim highlight -->
  <ellipse cx="600" cy="315" rx="330" ry="205" fill="none" stroke="#a5701f" stroke-width="1.2" opacity="0.5"/>
</svg>
