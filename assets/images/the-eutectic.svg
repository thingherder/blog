<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-label="A eutectic phase diagram: two liquidus curves descending from the pure-component melting points to meet at a single low eutectic point, with a pasty range on either side">
  <rect width="800" height="420" fill="#12161f"/>

  <!-- plot frame -->
  <line x1="100" y1="60" x2="100" y2="340" stroke="#2a3140" stroke-width="1.5"/>
  <line x1="100" y1="340" x2="700" y2="340" stroke="#2a3140" stroke-width="1.5"/>

  <!-- axis labels -->
  <text x="92" y="200" fill="#5c6472" font-family="Georgia, serif" font-size="13" text-anchor="end" transform="rotate(-90 92 200)">temperature</text>
  <text x="400" y="370" fill="#5c6472" font-family="Georgia, serif" font-size="13" text-anchor="middle">composition &#8594; (pure A to pure B)</text>

  <!-- liquid region fill (above the liquidus curves) -->
  <path d="M100,60 L700,60 L700,140 Q560,250 340,300 Q180,250 100,90 Z" fill="#e8a35c" fill-opacity="0.07"/>

  <!-- solid region (below the eutectic isotherm) -->
  <rect x="100" y="300" width="600" height="40" fill="#6fb3c9" fill-opacity="0.08"/>

  <!-- pasty / mushy lenses between each liquidus and the eutectic line -->
  <path d="M100,90 Q180,250 340,300 L100,300 Z" fill="#e8a35c" fill-opacity="0.12"/>
  <path d="M700,140 Q560,250 340,300 L700,300 Z" fill="#e8a35c" fill-opacity="0.12"/>

  <!-- eutectic isotherm (solidus line) -->
  <line x1="100" y1="300" x2="700" y2="300" stroke="#6fb3c9" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- left liquidus curve: from pure-A melting point down to the eutectic -->
  <path d="M100,90 Q180,250 340,300" fill="none" stroke="#e8a35c" stroke-width="3"/>
  <!-- right liquidus curve: from pure-B melting point down to the eutectic -->
  <path d="M700,140 Q560,250 340,300" fill="none" stroke="#e8a35c" stroke-width="3"/>

  <!-- melting points of the pure components -->
  <circle cx="100" cy="90" r="4" fill="#e8a35c"/>
  <circle cx="700" cy="140" r="4" fill="#e8a35c"/>
  <text x="112" y="86" fill="#c7a06a" font-family="Georgia, serif" font-size="12">pure A melts</text>
  <text x="688" y="136" fill="#c7a06a" font-family="Georgia, serif" font-size="12" text-anchor="end">pure B melts</text>

  <!-- the eutectic point -->
  <circle cx="340" cy="300" r="6.5" fill="#f2f2ec"/>
  <circle cx="340" cy="300" r="12" fill="none" stroke="#f2f2ec" stroke-width="1" stroke-opacity="0.5"/>
  <line x1="340" y1="300" x2="340" y2="340" stroke="#5c6472" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="340" y="286" fill="#f2f2ec" font-family="Georgia, serif" font-size="14" text-anchor="middle" font-style="italic">the eutectic</text>

  <!-- region labels -->
  <text x="400" y="110" fill="#c7a06a" font-family="Georgia, serif" font-size="15" text-anchor="middle" font-style="italic">liquid</text>
  <text x="215" y="282" fill="#b9864f" font-family="Georgia, serif" font-size="11" text-anchor="middle" transform="rotate(-18 215 282)">pasty</text>
  <text x="520" y="285" fill="#b9864f" font-family="Georgia, serif" font-size="11" text-anchor="middle" transform="rotate(14 520 285)">pasty</text>
  <text x="400" y="326" fill="#6fb3c9" font-family="Georgia, serif" font-size="13" text-anchor="middle" font-style="italic">solid</text>
</svg>
