<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-label="A dark cross-section of the Earth's crust. A horizontal line marks the surface. Above it rises a tall pale mountain peak; below it, mirrored and far larger, plunges the mountain's deep root into a denser mantle shown as a warm gradient. A smaller peak to the right has a correspondingly shallower root, showing that height is matched by depth. A faint upward arrow beside the large root suggests isostatic rebound.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#191622"/>
      <stop offset="100%" stop-color="#20202c"/>
    </linearGradient>
    <linearGradient id="mantle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2230"/>
      <stop offset="55%" stop-color="#4a2c2a"/>
      <stop offset="100%" stop-color="#6e3a26"/>
    </linearGradient>
    <linearGradient id="crustPeak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9edf4"/>
      <stop offset="100%" stop-color="#9aa3b4"/>
    </linearGradient>
    <linearGradient id="crustRoot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b94a6" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#5a6274" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="deepGlow" cx="42%" cy="78%" r="55%">
      <stop offset="0%" stop-color="#f0893a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f0893a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- sky above the surface -->
  <rect width="800" height="150" fill="url(#sky)"/>
  <!-- mantle below the surface -->
  <rect y="150" width="800" height="270" fill="url(#mantle)"/>
  <!-- warm glow from the deep -->
  <ellipse cx="330" cy="360" rx="340" ry="180" fill="url(#deepGlow)"/>

  <!-- the surface / waterline -->
  <line x1="0" y1="150" x2="800" y2="150" stroke="#cdd3dd" stroke-width="1.4" stroke-opacity="0.5" stroke-dasharray="7 6"/>

  <!-- ===== LARGE BLOCK: tall peak, deep root ===== -->
  <!-- deep root (the large submerged body) -->
  <path d="M232,150 L428,150 L408,250 L372,330 L330,392 L288,330 L252,250 Z"
        fill="url(#crustRoot)"/>
  <!-- faint internal banding in the root -->
  <path d="M252,250 L408,250" stroke="#e8edf4" stroke-width="0.8" stroke-opacity="0.12"/>
  <path d="M272,310 L388,310" stroke="#e8edf4" stroke-width="0.8" stroke-opacity="0.10"/>
  <!-- tall peak above the surface -->
  <path d="M276,150 L330,46 L384,150 Z" fill="url(#crustPeak)"/>
  <!-- snow highlight on peak -->
  <path d="M330,46 L352,88 L338,92 L330,74 L322,92 L308,88 Z" fill="#ffffff" fill-opacity="0.75"/>

  <!-- ===== SMALL BLOCK: short peak, shallow root ===== -->
  <path d="M560,150 L676,150 L662,206 L618,250 L574,206 Z" fill="url(#crustRoot)" fill-opacity="0.92"/>
  <path d="M588,150 L618,96 L648,150 Z" fill="url(#crustPeak)"/>
  <path d="M618,96 L632,124 L624,126 L618,112 L612,126 L604,124 Z" fill="#ffffff" fill-opacity="0.7"/>

  <!-- eroded grains lifting off the tall summit -->
  <g fill="#e9edf4">
    <circle cx="330" cy="36" r="1.6" fill-opacity="0.7"/>
    <circle cx="344" cy="44" r="1.2" fill-opacity="0.55"/>
    <circle cx="316" cy="42" r="1.3" fill-opacity="0.5"/>
    <circle cx="352" cy="30" r="1.0" fill-opacity="0.45"/>
  </g>

  <!-- rebound arrow beside the large root: the lightened block floating up -->
  <g stroke="#f3cf86" stroke-width="2" fill="none" stroke-opacity="0.75" stroke-linecap="round">
    <line x1="452" y1="320" x2="452" y2="196"/>
    <path d="M444,210 L452,194 L460,210"/>
  </g>
</svg>
