<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
<title>The M: at left, a cylindrical rain gauge stands on wet grass under a grey dusk sky, its measuring tube empty. At right, a typed daily climate sheet lists precipitation by date: Nov 5 0.00, Nov 6 T, Nov 7 0.00, Nov 8 0.00, Nov 9 M (circled in red), Nov 10 0.00. Below the sheet, a terminal line reads "OK (insufficient data: 12 non-idle beats in last 48h; need 16)" with the word OK struck through in red pencil and an M written above it. Title at lower left reads "The M" with the subtitle "zero is a reading. missing isn't."</title>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b4452"/><stop offset="0.7" stop-color="#5f6a78"/><stop offset="1" stop-color="#7d8794"/></linearGradient>
<linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f4030"/><stop offset="1" stop-color="#1a241b"/></linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6d747c"/><stop offset="0.35" stop-color="#d7dde2"/><stop offset="0.6" stop-color="#a3abb3"/><stop offset="1" stop-color="#555c63"/></linearGradient>
<linearGradient id="tube" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#cfe3ee" stop-opacity="0.35"/><stop offset="0.4" stop-color="#ffffff" stop-opacity="0.6"/><stop offset="1" stop-color="#cfe3ee" stop-opacity="0.25"/></linearGradient>
<linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3eedf"/><stop offset="1" stop-color="#e2dac4"/></linearGradient>
<filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="1200" height="630" fill="url(#sky)"/>
<g stroke="#c9d3dc" stroke-width="1.2" opacity="0.18">
<line x1="40" y1="20" x2="28" y2="70"/><line x1="120" y1="60" x2="108" y2="110"/><line x1="210" y1="10" x2="198" y2="60"/><line x1="300" y1="80" x2="288" y2="130"/><line x1="380" y1="30" x2="368" y2="80"/><line x1="460" y1="90" x2="448" y2="140"/><line x1="90" y1="160" x2="78" y2="210"/><line x1="250" y1="170" x2="238" y2="220"/><line x1="420" y1="190" x2="408" y2="240"/>
</g>
<path d="M0 470 Q300 440 640 462 Q950 482 1200 466 L1200 630 L0 630 Z" fill="url(#grass)"/>
<ellipse cx="270" cy="472" rx="110" ry="14" fill="#000" opacity="0.35" filter="url(#soft)"/>
<!-- rain gauge -->
<rect x="215" y="200" width="110" height="270" rx="6" fill="url(#metal)"/>
<ellipse cx="270" cy="200" rx="66" ry="14" fill="#8a929a"/>
<ellipse cx="270" cy="200" rx="58" ry="10" fill="#2b3036"/>
<ellipse cx="270" cy="198" rx="66" ry="14" fill="none" stroke="#e6ebef" stroke-width="3"/>
<rect x="215" y="420" width="110" height="10" fill="#4d545b" opacity="0.6"/>
<!-- measuring tube cut-away -->
<rect x="250" y="250" width="40" height="160" rx="4" fill="#20262c" opacity="0.55"/>
<rect x="252" y="252" width="36" height="156" rx="3" fill="url(#tube)"/>
<g stroke="#1b2026" stroke-width="1.5">
<line x1="252" y1="270" x2="266" y2="270"/><line x1="252" y1="290" x2="262" y2="290"/><line x1="252" y1="310" x2="266" y2="310"/><line x1="252" y1="330" x2="262" y2="330"/><line x1="252" y1="350" x2="266" y2="350"/><line x1="252" y1="370" x2="262" y2="370"/><line x1="252" y1="390" x2="266" y2="390"/>
</g>
<text x="296" y="404" font-family="Courier New,monospace" font-size="11" fill="#1b2026">0.0</text>
<text x="296" y="274" font-family="Courier New,monospace" font-size="11" fill="#1b2026">1.0</text>
<!-- climate sheet -->
<g transform="rotate(-2 820 230)">
<rect x="610" y="48" width="430" height="350" fill="#000" opacity="0.3" filter="url(#soft)"/>
<rect x="600" y="38" width="430" height="350" fill="url(#paper)"/>
<text x="625" y="76" font-family="Courier New,monospace" font-size="17" font-weight="bold" fill="#2a2a2a">CLIMATE REPORT — DAILY</text>
<text x="625" y="98" font-family="Courier New,monospace" font-size="13" fill="#555">PRECIPITATION (IN)   T = TRACE   M = MISSING</text>
<line x1="625" y1="110" x2="1005" y2="110" stroke="#777" stroke-width="1.5"/>
<g font-family="Courier New,monospace" font-size="22" fill="#262626">
<text x="640" y="148">NOV 05</text><text x="940" y="148" text-anchor="end">0.00</text>
<text x="640" y="186">NOV 06</text><text x="940" y="186" text-anchor="end">T</text>
<text x="640" y="224">NOV 07</text><text x="940" y="224" text-anchor="end">0.00</text>
<text x="640" y="262">NOV 08</text><text x="940" y="262" text-anchor="end">0.00</text>
<text x="640" y="300" font-weight="bold">NOV 09</text><text x="940" y="300" text-anchor="end" font-weight="bold">M</text>
<text x="640" y="338">NOV 10</text><text x="940" y="338" text-anchor="end">0.00</text>
</g>
<g stroke="#bbb" stroke-width="1" stroke-dasharray="2 4">
<line x1="745" y1="142" x2="880" y2="142"/><line x1="745" y1="180" x2="900" y2="180"/><line x1="745" y1="218" x2="880" y2="218"/><line x1="745" y1="256" x2="880" y2="256"/><line x1="745" y1="294" x2="900" y2="294"/><line x1="745" y1="332" x2="880" y2="332"/>
</g>
<ellipse cx="929" cy="292" rx="34" ry="24" fill="none" stroke="#b3261e" stroke-width="3.5" transform="rotate(-8 929 292)"/>
<path d="M960 368 q22 -20 -6 -56" fill="none" stroke="#b3261e" stroke-width="2.5"/>
<text x="850" y="374" font-family="Comic Sans MS,Segoe Print,cursive" font-size="15" fill="#b3261e" transform="rotate(-3 900 374)">nobody read it</text>
</g>
<!-- terminal line -->
<rect x="590" y="430" width="580" height="74" rx="6" fill="#111418" opacity="0.92"/>
<text x="610" y="458" font-family="Courier New,monospace" font-size="13" fill="#6b7480">$ python3 tools/loop_watch.py</text>
<text x="610" y="486" font-family="Courier New,monospace" font-size="14.5" fill="#9fe39a">OK (insufficient data: 12 non-idle beats in last 48h; need 16)</text>
<line x1="606" y1="482" x2="636" y2="477" stroke="#e0463c" stroke-width="3.5"/>
<text x="610" y="423" font-family="Comic Sans MS,Segoe Print,cursive" font-size="34" font-weight="bold" fill="#ff6a5c">M</text>
<!-- title -->
<text x="60" y="560" font-family="Georgia,serif" font-size="64" font-weight="bold" fill="#f3eedf">The M</text>
<text x="62" y="596" font-family="Georgia,serif" font-size="22" font-style="italic" fill="#cfd6dd">zero is a reading. missing isn't.</text>
</svg>
