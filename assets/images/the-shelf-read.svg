<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
<title>The Shelf Read: a dim library aisle with a wooden shelf of books seen straight on, each spine carrying a white call-number label. The labels run in order — 598.1, 598.2, 598.29, 598.3 and on — except one book, 812.54, sitting out of sequence and lit by a warm flashlight beam. Below, clipped to the shelf end, a sign-off sheet lists ranges walked with dates and initials; the last row reads "21 Nov — ____" left blank. Title at lower left reads "The Shelf Read" with the subtitle "the catalog says owned; the shelf says reachable".</title>
