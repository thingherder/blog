<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-label="Inside a Victorian signal box at dusk: a row of eight tall levers painted red, black, blue and white stands before a window showing a semaphore signal and a junction of rails. Three levers are pulled back. Below the floor, cut away, a bed of horizontal iron locking bars with notched tappets runs beneath the levers, one bar blocking a lever from moving.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b2f4f"/>
      <stop offset="60%" stop-color="#b8645a"/>
      <stop offset="100%" stop-color="#f0b46c"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d2e22"/>
      <stop offset="100%" stop-color="#241a13"/>
    </linearGradient>
    <linearGradient id="bed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14110d"/>
      <stop offset="100%" stop-color="#0a0806"/>
    </linearGradient>
    <linearGradient id="iron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7d7a73"/>
      <stop offset="100%" stop-color="#47443e"/>
    </linearGradient>
  </defs>

  <!-- box interior wall -->
  <rect width="800" height="420" fill="url(#wall)"/>

  <!-- window with dusk view -->
  <rect x="60" y="24" width="680" height="170" fill="url(#sky)"/>
  <!-- distant hills -->
  <path d="M60 160 Q180 128 300 150 T560 140 T740 152 L740 194 L60 194 Z" fill="#3a2f3a" opacity="0.75"/>
  <!-- rails diverging at a junction -->
  <g stroke="#1b1612" stroke-width="2.5" fill="none">
    <path d="M60 188 L400 176 L740 176"/>
    <path d="M60 192 L400 182 L740 182"/>
    <path d="M400 179 Q520 170 740 150"/>
    <path d="M410 184 Q530 176 740 157"/>
  </g>
  <!-- semaphore signal post -->
  <line x1="610" y1="60" x2="610" y2="176" stroke="#1b1612" stroke-width="4"/>
  <g transform="rotate(-38 610 71)"><rect x="610" y="66" width="56" height="10" fill="#c8312a"/><rect x="646" y="67" width="6" height="8" fill="#f2f2e6"/></g>
  <circle cx="606" cy="80" r="4.5" fill="#7fe08a"/>
  <circle cx="606" cy="80" r="11" fill="#7fe08a" opacity="0.22"/>
  <!-- first star -->
  <circle cx="140" cy="52" r="1.6" fill="#fff6d8"/>
  <!-- window mullions -->
  <g fill="#2a1f17">
    <rect x="56" y="20" width="688" height="8"/>
    <rect x="56" y="190" width="688" height="10"/>
    <rect x="56" y="20" width="8" height="178"/>
    <rect x="736" y="20" width="8" height="178"/>
    <rect x="226" y="20" width="6" height="178"/>
    <rect x="396" y="20" width="6" height="178"/>
    <rect x="566" y="20" width="6" height="178"/>
    <rect x="56" y="104" width="688" height="4"/>
  </g>

  <!-- floorboards -->
  <rect x="0" y="296" width="800" height="18" fill="#5b4330"/>
  <rect x="0" y="296" width="800" height="3" fill="#7a5c41"/>
  <!-- frame casting -->
  <rect x="150" y="290" width="500" height="14" rx="3" fill="#2e2a26" stroke="#121010"/>

  <!-- levers -->
  <line x1="190" y1="300" x2="196" y2="86" stroke="#b3261e" stroke-width="11" stroke-linecap="round"/>
  <line x1="190" y1="300" x2="196" y2="86" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3" stroke-linecap="round" transform="translate(-3,0)"/>
  <rect x="189" y="82" width="14" height="30" rx="5" fill="#d9d2c0" stroke="#6b6253" stroke-width="1.5"/>
  <rect x="176" y="268" width="28" height="12" rx="2" fill="#efe7d2" stroke="#3a342c" stroke-width="1"/>
  <text x="190" y="277.5" font-family="Georgia,serif" font-size="9" text-anchor="middle" fill="#2b261f">1</text>
  <line x1="250" y1="300" x2="230" y2="92" stroke="#b3261e" stroke-width="11" stroke-linecap="round"/>
  <line x1="250" y1="300" x2="230" y2="92" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3" stroke-linecap="round" transform="translate(-3,0)"/>
  <rect x="223" y="88" width="14" height="30" rx="5" fill="#d9d2c0" stroke="#6b6253" stroke-width="1.5"/>
  <rect x="236" y="268" width="28" height="12" rx="2" fill="#efe7d2" stroke="#3a342c" stroke-width="1"/>
  <text x="250" y="277.5" font-family="Georgia,serif" font-size="9" text-anchor="middle" fill="#2b261f">2</text>
  <line x1="310" y1="300" x2="290" y2="92" stroke="#1a1a1a" stroke-width="11" stroke-linecap="round"/>
  <line x1="310" y1="300" x2="290" y2="92" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3" stroke-linecap="round" transform="translate(-3,0)"/>
  <rect x="283" y="88" width="14" height="30" rx="5" fill="#d9d2c0" stroke="#6b6253" stroke-width="1.5"/>
  <rect x="296" y="268" width="28" height="12" rx="2" fill="#efe7d2" stroke="#3a342c" stroke-width="1"/>
  <text x="310" y="277.5" font-family="Georgia,serif" font-size="9" text-anchor="middle" fill="#2b261f">3</text>
  <line x1="370" y1="300" x2="376" y2="86" stroke="#2a5aa8" stroke-width="11" stroke-linecap="round"/>
  <line x1="370" y1="300" x2="376" y2="86" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3" stroke-linecap="round" transform="translate(-3,0)"/>
  <rect x="369" y="82" width="14" height="30" rx="5" fill="#d9d2c0" stroke="#6b6253" stroke-width="1.5"/>
  <rect x="356" y="268" width="28" height="12" rx="2" fill="#efe7d2" stroke="#3a342c" stroke-width="1"/>
  <text x="370" y="277.5" font-family="Georgia,serif" font-size="9" text-anchor="middle" fill="#2b261f">4</text>
  <line x1="430" y1="300" x2="436" y2="86" stroke="#1a1a1a" stroke-width="11" stroke-linecap="round"/>
  <line x1="430" y1="300" x2="436" y2="86" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3" stroke-linecap="round" transform="translate(-3,0)"/>
  <rect x="429" y="82" width="14" height="30" rx="5" fill="#d9d2c0" stroke="#6b6253" stroke-width="1.5"/>
  <rect x="416" y="268" width="28" height="12" rx="2" fill="#efe7d2" stroke="#3a342c" stroke-width="1"/>
  <text x="430" y="277.5" font-family="Georgia,serif" font-size="9" text-anchor="middle" fill="#2b261f">5</text>
  <line x1="490" y1="300" x2="496" y2="86" stroke="#b3261e" stroke-width="11" stroke-linecap="round"/>
  <line x1="490" y1="300" x2="496" y2="86" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3" stroke-linecap="round" transform="translate(-3,0)"/>
  <rect x="489" y="82" width="14" height="30" rx="5" fill="#d9d2c0" stroke="#6b6253" stroke-width="1.5"/>
  <rect x="476" y="268" width="28" height="12" rx="2" fill="#efe7d2" stroke="#3a342c" stroke-width="1"/>
  <text x="490" y="277.5" font-family="Georgia,serif" font-size="9" text-anchor="middle" fill="#2b261f">6</text>
  <line x1="550" y1="300" x2="556" y2="86" stroke="#e8e2d0" stroke-width="11" stroke-linecap="round"/>
  <line x1="550" y1="300" x2="556" y2="86" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3" stroke-linecap="round" transform="translate(-3,0)"/>
  <rect x="549" y="82" width="14" height="30" rx="5" fill="#d9d2c0" stroke="#6b6253" stroke-width="1.5"/>
  <rect x="536" y="268" width="28" height="12" rx="2" fill="#efe7d2" stroke="#3a342c" stroke-width="1"/>
  <text x="550" y="277.5" font-family="Georgia,serif" font-size="9" text-anchor="middle" fill="#2b261f">7</text>
  <line x1="610" y1="300" x2="590" y2="92" stroke="#1a1a1a" stroke-width="11" stroke-linecap="round"/>
  <line x1="610" y1="300" x2="590" y2="92" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3" stroke-linecap="round" transform="translate(-3,0)"/>
  <rect x="583" y="88" width="14" height="30" rx="5" fill="#d9d2c0" stroke="#6b6253" stroke-width="1.5"/>
  <rect x="596" y="268" width="28" height="12" rx="2" fill="#efe7d2" stroke="#3a342c" stroke-width="1"/>
  <text x="610" y="277.5" font-family="Georgia,serif" font-size="9" text-anchor="middle" fill="#2b261f">8</text>

  <!-- cutaway: locking bed beneath the floor -->
  <rect x="0" y="314" width="800" height="106" fill="url(#bed)"/>
  <rect x="140" y="318" width="520" height="94" fill="#1d1914" stroke="#4a3f30" stroke-dasharray="4 3"/>
  <rect x="184" y="322" width="12" height="34" fill="#8a7a5c" stroke="#3b3326" stroke-width="1"/>
  <rect x="244" y="338" width="12" height="34" fill="#8a7a5c" stroke="#3b3326" stroke-width="1"/>
  <rect x="304" y="338" width="12" height="34" fill="#8a7a5c" stroke="#3b3326" stroke-width="1"/>
  <rect x="364" y="322" width="12" height="34" fill="#8a7a5c" stroke="#3b3326" stroke-width="1"/>
  <rect x="424" y="322" width="12" height="34" fill="#8a7a5c" stroke="#3b3326" stroke-width="1"/>
  <rect x="484" y="322" width="12" height="34" fill="#8a7a5c" stroke="#3b3326" stroke-width="1"/>
  <rect x="544" y="322" width="12" height="34" fill="#8a7a5c" stroke="#3b3326" stroke-width="1"/>
  <rect x="604" y="338" width="12" height="34" fill="#8a7a5c" stroke="#3b3326" stroke-width="1"/>
  <!-- locking bars (horizontal) -->
  <rect x="150" y="344" width="500" height="9" fill="url(#iron)"/>
  <rect x="150" y="366" width="500" height="9" fill="url(#iron)"/>
  <rect x="150" y="388" width="500" height="9" fill="url(#iron)"/>
  <!-- locks/dogs: wedges riveted to bars -->
  <g fill="#c9a24a" stroke="#4d3b14" stroke-width="1">
    <path d="M232 344 L244 336 L256 344 Z"/>
    <path d="M412 366 L424 358 L436 366 Z"/>
    <path d="M592 344 L604 336 L616 344 Z"/>
  </g>
  <!-- the blocked lever: a dog sitting in its tappet's path -->
  <rect x="603" y="318" width="34" height="58" fill="none" stroke="#f0b46c" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.8"/>
  <text x="400" y="410" font-family="Georgia,serif" font-style="italic" font-size="12" text-anchor="middle" fill="#c9b894" opacity="0.85">the order lives in the iron</text>
</svg>
