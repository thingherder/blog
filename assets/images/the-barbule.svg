<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="On a dark blue-black field, a single feather is drawn as fine geometric lines. A warm central shaft runs on a gentle diagonal from lower left to upper right. Off the shaft, thin barbs branch to both sides. Along the lower side the barbs meet edge to edge into a smooth translucent vane, a coherent surface, with a scatter of small pale dots marking where microscopic hooks catch and zip adjacent barbs together. Along the upper side a stretch of barbs near the middle splays apart into a ragged amber gap — a place where the vane has come unzipped — while the barbs before and after it lie clean and closed. The image contrasts a whole, held surface against a small split waiting to be preened shut.">
