<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Georgia, 'Times New Roman', serif">
<title>The Tickler File: an open wooden file drawer under a lamp, holding a row of manila folders with staggered tabs numbered 1 to 31 and twelve green month folders. From the folder tabbed 2, a single white slip reading "DEC 2 — re-ask, in room" rises into the lamplight. Title at lower left reads "The Tickler File" with the subtitle "filed by when, not by what."</title>
